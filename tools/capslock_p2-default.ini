; capslock_p2 初始配置（安装包使用，不含个人 API 地址或 Key）
; 首次使用请在翻译/AI 面板的设置中填写 API 信息。

[Global]
autostart=0
debug=0
loadScript=scriptDemo.js
mouseSpeed=3
allowClipboard=1
loadingAnimation=1
language=1
javascriptOriginalReturn=0

[LLM]
; 在翻译或 AI 问答的设置界面填写全局 API 配置。
; endpoint=
; apiKey=
model=gpt-4o-mini

[LLMTranslate]
enabled=1
targetLanguage=Simplified Chinese
; 翻译引擎：auto=优先 LLM，未配置 LLM 时用有道；llm=只用 LLM；youdao=只用有道。
engine=auto

[TTranslate]
; 有道智云收费版翻译 API；[LLM] 已配置时优先 LLM。可在翻译面板设置中填写。
; appPaidID=
; appPaidKey=
; targetLanguage=      有道译文目标语言，留空 = auto（独立于 [LLMTranslate] 的目标语言）

[TVolcengine]
; 火山引擎机器翻译 API；[LLM] 已配置时优先 LLM。可在翻译面板设置中填写。
; accessKey=
; secretKey=
; targetLanguage=      火山译文目标语言，TranslateText 必填目标，留空 = zh
; region=cn-north-1    服务区域，一般无需修改

[QAI]
; QAI 只填写需要区别于 [LLM] 的问答配置；留空即使用 [LLM]。
contextChars=200000
