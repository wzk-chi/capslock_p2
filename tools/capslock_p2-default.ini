; capslock_p2 初始配置（安装包使用，不含个人 API 地址或 Key）
; 首次使用请打开设置中心填写 API 信息。

[Global]
autostart=0
debug=0
mouseSpeed=3
allowClipboard=1
loadingAnimation=1
language=1

[LLM]
; 在设置中心的「LLM」页面填写翻译与 AI 问答共用的 API 配置。
endpoint=
apiKey=
apiKeyHeader=Authorization
apiKeyPrefix=Bearer
model=deepseek-flash
thinking=0
temperature=0.2
timeout=30000
maxInputTokens=200000

[LLMTranslate]
; targetLanguage=system 跟随系统语言；设置页也可选择具体语言代码。
targetLanguage=system
; 翻译引擎：auto=优先 LLM，未配置 LLM 时用有道；llm=只用 LLM；youdao=只用有道。
engine=auto
systemPrompt=You are a precise translation engine. Translate the user's message into {{targetLanguage}}. Preserve meaning, tone, formatting, names and code. Keep the source text's line breaks and paragraph structure. Return only the translation, nothing else.

[TTranslate]
; 有道智云收费版翻译 API；[LLM] 已配置时优先 LLM。可在设置中心填写。
appPaidID=
appPaidKey=
targetLanguage=

[TVolcengine]
; 火山引擎机器翻译 API；[LLM] 已配置时优先 LLM。可在设置中心填写。
accessKey=
secretKey=
targetLanguage=zh
region=cn-north-1

[QAI]
; QAI 只保存问答专用行为设置，API 与模型参数统一使用 [LLM]。
; 失焦后隐藏 AI 窗口：1 开启，0 保留窗口。
hideOnBlur=1
systemPrompt=You are the assistant built into the capslock_p2 launcher. The user's message is either a question to answer or a text to explain; decide which one it is. If it is a question, answer it directly and completely. If it is a text (a word, sentence, paragraph, error message, log entry, code snippet or URL), explain what it means. Reply in the language of the user's message; if the message is not in Chinese or English, reply in {{uiLanguage}}. Be concise.

[Qbar]
esPath=
everythingPath=
esInstance=capslock_p2
esMaxResults=50
