<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>capslock_p2 Everything</title>
<link rel="stylesheet" href="theme.css">
<script src="toast.js"></script>
<script src="../vendor/lucide/lucide.min.js"></script>
<script src="icons.js"></script>
<script src="windowbar.js"></script>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--ui-bg);
  color: var(--ui-text);
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  user-select: none;
}

#shell { height: 100%; display: flex; flex-direction: column; min-width: 0; }

.searchbar {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--ui-line);
  background: var(--ui-surface);
}

#query {
  flex: 1 1 auto;
  min-width: 0;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--ui-line-strong);
  border-radius: 9px;
  background: var(--ui-surface-soft);
  color: var(--ui-text);
  font: 14px/1.4 Consolas, "Microsoft YaHei", monospace;
  outline: none;
  user-select: text;
}

#query:focus { border-color: var(--ui-accent); box-shadow: 0 0 0 3px var(--ui-ring); }
#query::placeholder { color: var(--ui-muted); }

.button {
  flex: none;
  min-height: 34px;
  padding: 0 13px;
  border: 1px solid var(--ui-line-strong);
  border-radius: 8px;
  background: var(--ui-surface);
  color: var(--ui-text);
  cursor: pointer;
  font-size: 12px;
}
.button:hover { border-color: var(--ui-line-strong); background: var(--ui-accent-quiet); }
.button.primary { border-color: var(--ui-button-bg); background: var(--ui-button-bg); color: var(--ui-button-text); }
.button.primary:hover { background: var(--ui-button-hover); }

.content { min-height: 0; flex: 1 1 auto; display: flex; }

#categories {
  flex: 0 0 128px;
  padding: 12px 9px;
  border-right: 1px solid var(--ui-line);
  background: var(--ui-surface-soft);
  overflow-y: auto;
}

.category {
  width: 100%;
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
  padding: 0 11px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ui-muted);
  cursor: pointer;
  text-align: left;
  font: 12px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
}
.category .lucide { width: 15px; height: 15px; }
.category:hover { background: var(--ui-accent-quiet); color: var(--ui-text); }
.category.active { background: var(--ui-accent-soft); color: var(--ui-accent-strong); font-weight: 650; }

.results-pane { min-width: 0; flex: 1 1 auto; display: flex; flex-direction: column; }
#statusBar {
  position: relative;
  flex: none;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--ui-line);
  color: var(--ui-muted);
  font-size: 11px;
}
#status {
  min-width: 0;
  padding: 0 15px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#status.error { color: var(--ui-danger); background: var(--ui-danger-soft); }
#status.loading { color: var(--ui-accent-strong); }

#sortButton {
  flex: none;
  min-height: 27px;
  max-width: 190px;
  margin-right: 8px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--ui-muted);
  cursor: pointer;
  font: 11px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#sortButton:hover, #sortButton.active { border-color: var(--ui-line-strong); background: var(--ui-accent-soft); color: var(--ui-accent-strong); }

#sortMenu {
  position: absolute;
  z-index: 15;
  top: calc(100% + 4px);
  right: 8px;
  min-width: 174px;
  padding: 5px;
  border: 1px solid var(--ui-line-strong);
  border-radius: 9px;
  background: var(--ui-surface-raised);
  box-shadow: var(--ui-shadow-soft);
}
#sortMenu.hidden { display: none; }

#resultList {
  min-height: 0;
  flex: 1 1 auto;
  padding: 5px 7px 14px;
  overflow-y: auto;
  outline: none;
}

.result {
  position: relative;
  min-height: 58px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 11px;
  border: 1px solid transparent;
  border-radius: 9px;
  cursor: default;
}
.result:hover { background: var(--ui-accent-quiet); }
.result.selected { border-color: var(--ui-line-strong); background: var(--ui-accent-soft); }
.result.stale { opacity: .58; cursor: wait; }
.result-icon { flex: none; width: 28px; height: 28px; display: grid; place-items: center; color: var(--ui-accent-strong); font-size: 22px; }
.result-icon img { width: 26px; height: 26px; object-fit: contain; }
.result-icon .lucide { width: 22px; height: 22px; }
.result-copy { min-width: 0; flex: 1 1 auto; }
.result-name { color: var(--ui-text); font-size: 13px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result-parent { margin-top: 3px; color: var(--ui-muted); font-size: 11px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 48px 16px; color: var(--ui-muted); text-align: center; font-size: 13px; }

#contextMenu {
  position: fixed;
  z-index: 20;
  min-width: 174px;
  padding: 5px;
  border: 1px solid var(--ui-line-strong);
  border-radius: 9px;
  background: var(--ui-surface-raised);
  box-shadow: var(--ui-shadow-soft);
}
#contextMenu.hidden { display: none; }
.menu-item {
  width: 100%;
  min-height: 31px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ui-text);
  cursor: pointer;
  text-align: left;
  font: 12px/1.2 "Segoe UI", "Microsoft YaHei", sans-serif;
}
.menu-item:hover { background: var(--ui-accent-quiet); color: var(--ui-accent-strong); }
.menu-item[aria-checked="true"] { background: var(--ui-accent-quiet); color: var(--ui-accent-strong); font-weight: 650; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 8px; background: var(--ui-line-strong); background-clip: padding-box; }
</style>
</head>
<body>
<main id="shell">
  <div class="windowbar" data-windowbar data-windowbar-title="capslock_p2 Everything" data-windowbar-icon="search"></div>
  <div class="searchbar">
    <input id="query" spellcheck="false" autocomplete="off">
    <button id="searchButton" class="button primary"><i data-lucide="search"></i><span data-label></span></button>
  </div>
  <div class="content">
    <nav id="categories" aria-label="File types"></nav>
    <section class="results-pane">
      <div id="statusBar">
        <div id="status"></div>
        <button id="sortButton" type="button" aria-haspopup="menu" aria-expanded="false"><i data-lucide="arrow-down-up"></i><span data-label></span></button>
        <div id="sortMenu" class="hidden" role="menu"></div>
      </div>
      <div id="resultList" tabindex="0" role="listbox" aria-label="Everything results"></div>
    </section>
  </div>
</main>
<div id="contextMenu" class="hidden" role="menu">
  <button class="menu-item" data-action="reveal" role="menuitem"><i data-lucide="folder-open"></i><span data-label></span></button>
  <button class="menu-item" data-action="copy" role="menuitem"><i data-lucide="copy"></i><span data-label></span></button>
  <button class="menu-item" data-action="copyPath" role="menuitem"><i data-lucide="file-code"></i><span data-label></span></button>
  <button class="menu-item" data-action="copyParent" role="menuitem"><i data-lucide="folder"></i><span data-label></span></button>
</div>
<script>
WindowBar.init();
WindowBar.debug('everything:script:start');
const query = document.getElementById('query');
const searchButton = document.getElementById('searchButton');
const categories = document.getElementById('categories');
const status = document.getElementById('status');
const sortButton = document.getElementById('sortButton');
const sortMenu = document.getElementById('sortMenu');
const resultList = document.getElementById('resultList');
const contextMenu = document.getElementById('contextMenu');
const windowDrag = document.getElementById('windowDrag');
const windowTitle = document.getElementById('windowTitle');
const pinBtn = document.getElementById('pinPanel');
const independentBtn = document.getElementById('independentPanel');
const closeBtn = document.getElementById('closePanel');

const CATEGORY_IDS = ['all', 'folder', 'excel', 'word', 'ppt', 'pdf', 'image', 'video', 'audio', 'archive'];
const CATEGORY_ICONS = {
  all: 'files', folder: 'folder', excel: 'file-spreadsheet', word: 'file-text',
  ppt: 'presentation', pdf: 'file-text', image: 'image', video: 'video',
  audio: 'music-2', archive: 'archive'
};
const SORT_OPTIONS = [
  ['name-asc', 'sortNameAsc'], ['name-desc', 'sortNameDesc'],
  ['path-asc', 'sortPathAsc'], ['path-desc', 'sortPathDesc'],
  ['size-asc', 'sortSizeAsc'], ['size-desc', 'sortSizeDesc'],
  ['modified-asc', 'sortModifiedAsc'], ['modified-desc', 'sortModifiedDesc']
];
const STRINGS = {
  zh: {
    appTitle: 'capslock_p2 Everything', pin: '固定', unpin: '取消固定', close: '关闭', independent: '独立窗口', dragWindow: '拖动移动窗口',
    placeholder: '搜索文件名，支持 Everything 搜索语法', search: '搜索', all: '全部', folder: '文件夹', excel: 'EXCEL', word: 'WORD', ppt: 'PPT', pdf: 'PDF', image: '图片', video: '视频', audio: '音频', archive: '压缩文件',
    loading: '搜索中…', empty: '没有找到结果', ready: n => `已显示 ${n} 项`, truncated: n => `已显示前 ${n} 项，请细化条件`, error: '搜索失败', reveal: '文件夹中显示', copy: '复制', copyPath: '复制路径', copyParent: '复制所在路径', sort: '排序', sortNameAsc: '按名称升序', sortNameDesc: '按名称降序', sortPathAsc: '按路径升序', sortPathDesc: '按路径降序', sortSizeAsc: '按大小升序', sortSizeDesc: '按大小降序', sortModifiedAsc: '按修改时间升序', sortModifiedDesc: '按修改时间降序', actionOk: '已完成', actionError: '操作失败'
  },
  en: {
    appTitle: 'capslock_p2 Everything', pin: 'Pin', unpin: 'Unpin', close: 'Close', independent: 'Independent window', dragWindow: 'Drag to move',
    placeholder: 'Search file names with Everything syntax', search: 'Search', all: 'All', folder: 'Folders', excel: 'EXCEL', word: 'WORD', ppt: 'PPT', pdf: 'PDF', image: 'Images', video: 'Videos', audio: 'Audio', archive: 'Archives',
    loading: 'Searching…', empty: 'No results', ready: n => `${n} item${n === 1 ? '' : 's'} shown`, truncated: n => `First ${n} items shown; refine the query`, error: 'Search failed', reveal: 'Show in folder', copy: 'Copy', copyPath: 'Copy path', copyParent: 'Copy containing path', sort: 'Sort', sortNameAsc: 'Name ascending', sortNameDesc: 'Name descending', sortPathAsc: 'Path ascending', sortPathDesc: 'Path descending', sortSizeAsc: 'Size ascending', sortSizeDesc: 'Size descending', sortModifiedAsc: 'Modified ascending', sortModifiedDesc: 'Modified descending', actionOk: 'Done', actionError: 'Action failed'
  }
};

let lang = 'zh';
let category = 'all';
let results = [];
let sortedResultsSource = null;
let sortedResultsSortId = '';
let sortedResultsCache = [];
let icons = {};
let selectedIndex = -1;
let resultsVersion = 0;
let latestRequestId = 0;
let composing = false;
let menuResultId = '';
let menuResultVersion = 0;
let actionTimer = 0;
let resultsInteractive = true;
let sortId = 'modified-desc';

function t(key, ...args) {
  const value = (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.zh[key] || key;
  return typeof value === 'function' ? value(...args) : value;
}
function post(message) {
  if (window.chrome && chrome.webview) chrome.webview.postMessage(JSON.stringify(message));
}
function renderCategories() {
  WindowBar.debug('everything:categories:start');
  categories.textContent = '';
  for (const id of CATEGORY_IDS) {
    const button = document.createElement('button');
    button.className = 'category' + (id === category ? ' active' : '');
    button.dataset.category = id;
    button.append(createIcon(CATEGORY_ICONS[id] || 'folder'), document.createTextNode(t(id)));
    button.addEventListener('click', () => {
      if (category === id) return;
      category = id;
      renderCategories();
      requestQuery(true);
    });
    categories.appendChild(button);
  }
  refreshIcons();
  WindowBar.debug('everything:categories:done');
}
function setButtonLabel(button, text) {
  const label = button.querySelector('[data-label]');
  if (label) label.textContent = text;
  else button.textContent = text;
}
function applyLanguage() {
  WindowBar.debug('everything:language:start');
  document.title = t('appTitle');
  windowTitle.textContent = t('appTitle');
  windowDrag.title = t('dragWindow');
  independentBtn.title = t('independent');
  independentBtn.setAttribute('aria-label', t('independent'));
  closeBtn.title = t('close');
  closeBtn.setAttribute('aria-label', t('close'));
  pinBtn.title = pinBtn.classList.contains('pinned') ? t('unpin') : t('pin');
  pinBtn.setAttribute('aria-label', pinBtn.title);
  query.placeholder = t('placeholder');
  setButtonLabel(searchButton, t('search'));
  setButtonLabel(contextMenu.querySelector('[data-action="reveal"]'), t('reveal'));
  setButtonLabel(contextMenu.querySelector('[data-action="copy"]'), t('copy'));
  setButtonLabel(contextMenu.querySelector('[data-action="copyPath"]'), t('copyPath'));
  setButtonLabel(contextMenu.querySelector('[data-action="copyParent"]'), t('copyParent'));
  setButtonLabel(sortButton, t('sort') + ': ' + t(sortOptionKey()));
  sortButton.setAttribute('aria-expanded', sortMenu.classList.contains('hidden') ? 'false' : 'true');
  sortMenu.textContent = '';
  SORT_OPTIONS.forEach(([id, key]) => {
    const button = document.createElement('button');
    button.className = 'menu-item';
    button.dataset.sort = id;
    button.textContent = t(key);
    button.setAttribute('role', 'menuitemradio');
    button.setAttribute('aria-checked', id === sortId ? 'true' : 'false');
    sortMenu.appendChild(button);
  });
  renderCategories();
  refreshIcons();
  WindowBar.debug('everything:language:done');
}

function applyPinnedState(value) {
  const pinned = !!value;
  WindowBar.setPinned(pinned);
  pinBtn.title = pinned ? t('unpin') : t('pin');
  pinBtn.setAttribute('aria-label', pinBtn.title);
}

window.setPinned = function (value) {
  applyPinnedState(value);
};

window.setNativeWindowMode = function (value) {
  WindowBar.setNativeWindowMode(value);
};
function sortOptionKey() {
  const option = SORT_OPTIONS.find(entry => entry[0] === sortId);
  return option ? option[1] : 'sortNameAsc';
}
function sortedResults() {
  if (sortedResultsSource === results && sortedResultsSortId === sortId)
    return sortedResultsCache;
  const ordered = results.slice();
  const [field, direction] = sortId.split('-');
  const sign = direction === 'desc' ? -1 : 1;
  ordered.sort((a, b) => {
    let left = '', right = '';
    if (field === 'name') {
      left = a.name || a.fullPath || '';
      right = b.name || b.fullPath || '';
    } else if (field === 'path') {
      left = a.fullPath || '';
      right = b.fullPath || '';
    } else if (field === 'size') {
      const difference = (Number(a.size) || 0) - (Number(b.size) || 0);
      if (difference) return difference * sign;
    } else if (field === 'modified') {
      left = a.modifiedAt || '';
      right = b.modifiedAt || '';
    }
    return String(left).localeCompare(String(right), undefined, { numeric: true, sensitivity: 'base' }) * sign;
  });
  sortedResultsSource = results;
  sortedResultsSortId = sortId;
  sortedResultsCache = ordered;
  return sortedResultsCache;
}
function requestQuery(immediate) {
  if (composing) return;
  hideMenu();
  hideSortMenu();
  post({ type: 'query', text: query.value, categoryId: category, immediate: !!immediate });
}
function hideMenu() {
  contextMenu.classList.add('hidden');
  menuResultId = '';
}
function hideSortMenu() {
  sortMenu.classList.add('hidden');
  sortButton.classList.remove('active');
  sortButton.setAttribute('aria-expanded', 'false');
}
function showMenu(event, item) {
  hideSortMenu();
  updateSelectedResult(sortedResults().indexOf(item));
  menuResultId = item.id;
  menuResultVersion = resultsVersion;
  contextMenu.classList.remove('hidden');
  const margin = 6;
  const maxX = window.innerWidth - contextMenu.offsetWidth - margin;
  const maxY = window.innerHeight - contextMenu.offsetHeight - margin;
  contextMenu.style.left = Math.max(margin, Math.min(event.clientX, maxX)) + 'px';
  contextMenu.style.top = Math.max(margin, Math.min(event.clientY, maxY)) + 'px';
}
function action(action) {
  if (!menuResultId) return;
  post({ type: 'action', action, resultId: menuResultId, resultsVersion: String(menuResultVersion) });
  hideMenu();
}
function renderResults() {
  resultList.textContent = '';
  if (!results.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = t('empty');
    resultList.appendChild(empty);
    return;
  }
  const ordered = sortedResults();
  ordered.forEach((item, index) => {
    const row = document.createElement('div');
    row.className = 'result' + (index === selectedIndex ? ' selected' : '') + (resultsInteractive ? '' : ' stale');
    row.dataset.index = String(index);
    row.tabIndex = -1;
    const icon = document.createElement('span');
    icon.className = 'result-icon';
    const src = item.icon ? icons[item.icon] : '';
    if (src) {
      const image = document.createElement('img');
      image.src = src;
      image.alt = '';
      image.draggable = false;
      icon.appendChild(image);
    } else icon.appendChild(createIcon(item.kind === 'folder' ? 'folder' : 'file'));
    const copy = document.createElement('span');
    copy.className = 'result-copy';
    const name = document.createElement('span');
    name.className = 'result-name';
    name.textContent = item.name || item.fullPath;
    name.title = item.fullPath || '';
    const parent = document.createElement('span');
    parent.className = 'result-parent';
    parent.textContent = item.parentPath || item.fullPath || '';
    parent.title = item.fullPath || '';
    copy.append(name, parent);
    row.append(icon, copy);
    row.addEventListener('mousedown', event => event.preventDefault());
    if (resultsInteractive) {
      row.addEventListener('click', () => { updateSelectedResult(index); resultList.focus(); });
      row.addEventListener('dblclick', () => post({ type: 'action', action: 'open', resultId: item.id, resultsVersion: String(resultsVersion) }));
      row.addEventListener('contextmenu', event => { event.preventDefault(); showMenu(event, item); });
    }
    resultList.appendChild(row);
  });
  refreshIcons();
}
function updateSelectedResult(index) {
  const previousIndex = selectedIndex;
  if (previousIndex === index) return;
  if (previousIndex >= 0)
    resultList.querySelector(`[data-index="${previousIndex}"]`)?.classList.remove('selected');
  selectedIndex = index;
  const row = resultList.querySelector(`[data-index="${selectedIndex}"]`);
  if (row) {
    row.classList.add('selected');
    row.scrollIntoView({ block: 'nearest' });
  }
}
function selectResult(index) {
  const ordered = sortedResults();
  if (!ordered.length) return;
  updateSelectedResult((index + ordered.length) % ordered.length);
}

window.initialize = function (payload) {
  WindowBar.debug('everything:initialize');
  payload = payload || {};
  lang = payload.uiLanguage === 'en' ? 'en' : 'zh';
  category = CATEGORY_IDS.includes(payload.categoryId) ? payload.categoryId : 'all';
  query.value = payload.text || '';
  selectedIndex = -1;
  latestRequestId = 0;
  resultsVersion = 0;
  hideMenu();
  hideSortMenu();
  applyLanguage();
  query.focus();
  query.setSelectionRange(query.value.length, query.value.length);
};
window.setLanguage = function (language) { lang = language === 'en' ? 'en' : 'zh'; applyLanguage(); };
window.focusInput = function () { query.focus(); query.setSelectionRange(query.value.length, query.value.length); };
window.addIcons = function (map) { Object.assign(icons, map || {}); renderResults(); };
window.setSearchState = function (payload) {
  payload = payload || {};
  const requestId = Number(payload.requestId || 0);
  if (requestId && requestId < latestRequestId) return;
  if (requestId) latestRequestId = requestId;
  resultsInteractive = payload.state !== 'loading' && payload.state !== 'error';
  if (!resultsInteractive) { hideMenu(); hideSortMenu(); }
  renderResults();
  status.className = payload.state === 'error' ? 'error' : (payload.state === 'loading' ? 'loading' : '');
  if (payload.state === 'loading') status.textContent = payload.message || t('loading');
  else if (payload.state === 'error') status.textContent = payload.message || t('error');
  else if (payload.state === 'ready' && payload.message) status.textContent = payload.message;
};
window.setResults = function (payload) {
  payload = payload || {};
  const requestId = Number(payload.requestId || 0);
  if (requestId && requestId < latestRequestId) return;
  if (requestId) latestRequestId = requestId;
  resultsVersion = Number(payload.resultsVersion || 0);
  results = Array.isArray(payload.items) ? payload.items : [];
  resultsInteractive = true;
  selectedIndex = results.length ? 0 : -1;
  renderResults();
  status.className = '';
  status.textContent = payload.truncated ? t('truncated', results.length) : t('ready', results.length);
};
window.showActionResult = function (payload) {
  payload = payload || {};
  clearTimeout(actionTimer);
  status.className = payload.error ? 'error' : '';
  status.textContent = payload.message || (payload.error ? t('actionError') : t('actionOk'));
  actionTimer = setTimeout(() => { if (status.className !== 'loading') status.textContent = t('ready', results.length); }, 2200);
};

query.addEventListener('compositionstart', () => { composing = true; });
query.addEventListener('compositionend', () => { composing = false; requestQuery(false); });
query.addEventListener('input', () => requestQuery(false));
query.addEventListener('keydown', event => {
  if (event.key === 'Enter') { event.preventDefault(); requestQuery(true); }
  else if (event.key === 'Escape') { event.preventDefault(); hideMenu(); hideSortMenu(); post({ type: 'hide' }); }
  else if (event.key === 'ArrowDown' && results.length) { event.preventDefault(); resultList.focus(); selectResult(0); }
});
searchButton.addEventListener('click', () => { requestQuery(true); query.focus(); });
sortButton.addEventListener('mousedown', event => event.stopPropagation());
sortButton.addEventListener('click', () => {
  const opening = sortMenu.classList.contains('hidden');
  hideMenu();
  if (opening) {
    sortMenu.classList.remove('hidden');
    sortButton.classList.add('active');
    sortButton.setAttribute('aria-expanded', 'true');
  } else hideSortMenu();
});
sortButton.addEventListener('keydown', event => {
  if (event.key === 'ArrowDown') {
    event.preventDefault();
    if (sortMenu.classList.contains('hidden')) sortButton.click();
    const first = sortMenu.querySelector('[data-sort]');
    if (first) first.focus();
  } else if (event.key === 'Escape' && !sortMenu.classList.contains('hidden')) {
    event.preventDefault();
    event.stopPropagation();
    hideSortMenu();
  }
});
sortMenu.addEventListener('mousedown', event => event.stopPropagation());
sortMenu.addEventListener('keydown', event => {
  const options = Array.from(sortMenu.querySelectorAll('[data-sort]'));
  const current = options.indexOf(document.activeElement);
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    if (!options.length) return;
    event.preventDefault();
    const delta = event.key === 'ArrowDown' ? 1 : -1;
    options[(current + delta + options.length) % options.length].focus();
  } else if (event.key === 'Escape') {
    event.preventDefault();
    event.stopPropagation();
    hideSortMenu();
    sortButton.focus();
  }
});
sortMenu.addEventListener('click', event => {
  const button = event.target.closest('[data-sort]');
  if (!button) return;
  sortId = button.dataset.sort;
  selectedIndex = results.length ? 0 : -1;
  hideSortMenu();
  applyLanguage();
  renderResults();
});
resultList.addEventListener('keydown', event => {
  const ordered = sortedResults();
  if (event.key === 'ArrowDown') { event.preventDefault(); selectResult(selectedIndex + 1); }
  else if (event.key === 'ArrowUp') { event.preventDefault(); selectResult(selectedIndex - 1); }
  else if (event.key === 'Enter' && resultsInteractive && selectedIndex >= 0) { event.preventDefault(); post({ type: 'action', action: event.ctrlKey ? 'reveal' : 'open', resultId: ordered[selectedIndex].id, resultsVersion: String(resultsVersion) }); }
  else if (event.key.toLowerCase() === 'c' && event.ctrlKey && resultsInteractive && selectedIndex >= 0) { event.preventDefault(); post({ type: 'action', action: 'copy', resultId: ordered[selectedIndex].id, resultsVersion: String(resultsVersion) }); }
  else if (event.key === 'Escape') { event.preventDefault(); hideMenu(); hideSortMenu(); query.focus(); }
});
contextMenu.addEventListener('click', event => { const button = event.target.closest('[data-action]'); if (button) action(button.dataset.action); });
document.addEventListener('mousedown', event => {
  if (!contextMenu.contains(event.target)) hideMenu();
  if (!sortMenu.contains(event.target) && event.target !== sortButton) hideSortMenu();
});
document.addEventListener('keydown', event => {
  if (event.ctrlKey && event.key.toLowerCase() === 'l') {
    event.preventDefault();
    hideMenu();
    hideSortMenu();
    query.focus();
    query.select();
    return;
  }
  if (event.key === 'Escape' && !query.matches(':focus')) { hideMenu(); hideSortMenu(); query.focus(); }
});

applyLanguage();
post({ type: 'ready' });
</script>
</body>
</html>
