<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>capslock_p2 笔记</title>
<link rel="stylesheet" href="theme.css">
<script src="toast.js"></script>
<script src="../vendor/lucide/lucide.min.js"></script>
<script src="icons.js"></script>
<script src="dialog.js"></script>
<script src="windowbar.js"></script>
<script src="../vendor/marked.min.js"></script>

<style>
:root { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--ui-bg); color: var(--ui-text); }
button, input, textarea { font: inherit; }
button { color: inherit; cursor: default; }
.app { height: 100%; display: flex; flex-direction: column; }
.topbar { height: 62px; flex: 0 0 62px; display: flex; align-items: center; justify-content: center; padding: 0 18px; border-bottom: 1px solid var(--ui-line); background: var(--ui-surface); }
.search-group { width: min(760px, 100%); display: flex; align-items: center; gap: 8px; }
.search { min-width: 0; flex: 1; height: 35px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid var(--ui-line-strong); border-radius: 8px; background: var(--ui-surface-soft); color: var(--ui-muted); }
.search > .lucide { width: 15px; height: 15px; }
.search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ui-text); font-size: 12px; }
.search input::placeholder { color: var(--ui-subtle); }
.search-button { flex: 0 0 37px; width: 37px; height: 35px; display: grid; place-items: center; border: 1px solid var(--ui-button-bg); border-radius: 8px; background: var(--ui-button-bg); color: var(--ui-button-text); font-size: 16px; }
.search-button:hover, .search-button:focus-visible { filter: brightness(1.06); }
.workspace { min-height: 0; flex: 1; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.workspace.edit-mode { grid-template-columns: 220px minmax(0, 1fr); }
.workspace.edit-mode .browse { display: none; }
.workspace:not(.edit-mode) .editor-page { display: none; }
.sidebar { min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 17px 10px; border-right: 1px solid var(--ui-line); background: var(--ui-surface-soft); }
.side-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 9px; font-size: 15px; font-weight: 650; }
.side-count { color: var(--ui-subtle); font-size: 10px; font-weight: 400; }
.tag-actions { display: flex; gap: 5px; margin: 0 3px 10px; }
.tag-action { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--ui-line); border-radius: 6px; background: var(--ui-surface); color: var(--ui-muted); }
.tag-action .lucide { width: 12px; height: 12px; }
.tag-action:hover, .tag-action:focus-visible { border-color: var(--ui-line-strong); color: var(--ui-accent-strong); }
.tag-list { min-height: 0; overflow: auto; }
.tag-row { width: 100%; min-height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 9px; border: 0; border-radius: 7px; background: transparent; color: var(--ui-muted); text-align: left; font-size: 11px; }
.tag-row:hover { background: var(--ui-accent-quiet); color: var(--ui-text); }
.tag-row.active { background: var(--ui-accent-soft); color: var(--ui-accent-strong); }
.tag-row.active { font-weight: 650; }
.tag-count { color: var(--ui-subtle); font-size: 10px; }
.browse { min-width: 0; min-height: 0; background: var(--ui-bg); }
.browse { overflow: auto; padding: 22px clamp(18px, 3vw, 34px) 30px; }
.browse-inner { max-width: 760px; margin: 0 auto; }
.browse-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.browse-heading h1 { margin: 0; font-size: 19px; font-weight: 650; }
.muted { color: var(--ui-subtle); font-size: 10px; }
.note-entry { margin: 6px 0; padding: 10px 12px 8px; border: 1px solid var(--ui-line); border-radius: 9px; background: var(--ui-surface); box-shadow: var(--ui-shadow-soft); }
.note-entry.pinned { border-color: var(--ui-line-strong); }
.note-title { width: 100%; display: flex; align-items: center; gap: 7px; padding: 0 0 5px; border: 0; background: transparent; color: var(--ui-text); text-align: left; font-size: 13px; font-weight: 650; }
.note-title:hover { color: var(--ui-accent-strong); }
.pin-mark { color: var(--ui-accent); font-size: 11px; }
.preview-lines { display: grid; gap: 2px; max-height: 168px; overflow-y: auto; padding-right: 3px; }
.preview-block { width: 100%; min-height: 24px; display: flex; align-items: center; gap: 6px; padding: 2px 6px; border: 0; border-radius: 5px; background: transparent; color: var(--ui-muted); font-size: 11px; line-height: 1.45; text-align: left; }
button.preview-block:hover, button.preview-block:focus-visible { background: var(--ui-accent-quiet); color: var(--ui-text); }
.preview-text { min-width: 0; }
.preview-marker { flex: 0 0 auto; color: var(--ui-subtle); }
.preview-kind-heading { color: var(--ui-text); font-weight: 650; }
.preview-heading-1 { font-size: 15px; }
.preview-heading-2 { font-size: 14px; }
.preview-heading-3 { font-size: 13px; }
.preview-heading-4, .preview-heading-5, .preview-heading-6 { font-size: 12px; }
.preview-kind-code { align-items: flex-start; padding: 5px 7px; background: var(--ui-code); color: var(--ui-text); font-family: Consolas, monospace; }
.preview-kind-code .preview-text { white-space: pre-wrap; word-break: break-word; }
.preview-kind-image img { display: block; max-width: 100%; max-height: 84px; border-radius: 5px; }
.preview-rule { height: 1px; margin: 3px 6px; background: var(--ui-line); }
.note-meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; color: var(--ui-subtle); font-size: 10px; }
.note-tag { margin-left: auto; color: var(--ui-accent-strong); }
.empty { padding: 35px 10px; color: var(--ui-muted); text-align: center; font-size: 12px; }
.editor-page { min-width: 0; min-height: 0; height: 100%; display: flex; overflow: auto; padding: 0 clamp(18px, 3vw, 34px); background: var(--ui-bg); }
.editor-page .editor { width: min(900px, 100%); height: 100%; min-height: 0; margin: 0 auto; border: 0; border-radius: 0; box-shadow: none; background: var(--ui-bg); }
.editor { width: min(900px, 100%); height: min(670px, 100%); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--ui-line-strong); border-radius: 12px; background: var(--ui-surface); box-shadow: var(--ui-shadow); }
.editor-head { display: flex; align-items: center; gap: 10px; padding: 15px 17px 10px; border-bottom: 1px solid var(--ui-line); }
.editor-back { width: 32px; height: 30px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; border: 1px solid var(--ui-line); border-radius: 6px; background: var(--ui-surface); color: var(--ui-muted); }
.editor-back .lucide { width: 13px; height: 13px; }
.editor-back:hover, .editor-back:focus-visible { border-color: var(--ui-line-strong); color: var(--ui-accent-strong); }
.editor-title { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--ui-text); font-size: 20px; font-weight: 650; }
.editor-title::placeholder { color: var(--ui-subtle); }
.editor-tags { display: flex; align-items: flex-start; gap: 9px; padding: 8px 17px; border-bottom: 1px solid var(--ui-line); }
.editor-tags-label { flex: 0 0 auto; padding-top: 5px; white-space: nowrap; writing-mode: horizontal-tb; color: var(--ui-muted); font-size: 11px; }
.tag-picker { position: relative; min-width: 0; flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 27px; padding: 2px 0; }
.tag-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.tag-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 99px; background: var(--ui-accent-soft); color: var(--ui-accent-strong); font-size: 10px; white-space: nowrap; }
.tag-chip button { padding: 0; border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 12px; line-height: 1; }
.tag-picker input { min-width: 120px; flex: 1; width: auto; border: 0; outline: 0; background: transparent; color: var(--ui-text); font-size: 11px; }
.tag-picker input::placeholder { color: var(--ui-subtle); }
.tag-options { position: absolute; z-index: 5; top: calc(100% + 5px); left: 0; right: 0; max-height: 180px; overflow: auto; padding: 4px; border: 1px solid var(--ui-line-strong); border-radius: 7px; background: var(--ui-surface); box-shadow: var(--ui-shadow-soft); }
.tag-options.hidden { display: none; }
.tag-option { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border: 0; border-radius: 5px; background: transparent; color: var(--ui-muted); text-align: left; font-size: 11px; }
.tag-option:hover { background: var(--ui-accent-quiet); color: var(--ui-text); }
.tag-option.selected { background: var(--ui-accent-soft); color: var(--ui-accent-strong); }
.editor-toolbar { display: flex; flex-wrap: wrap; gap: 3px; padding: 7px 14px; border-bottom: 1px solid var(--ui-line); background: var(--ui-surface-soft); }
.tool { width: 28px; min-width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--ui-muted); }
.tool .lucide { width: 16px; height: 16px; }
.tool:hover, .tool:focus-visible { border-color: var(--ui-line-strong); background: var(--ui-surface); color: var(--ui-accent-strong); }
.editor-content { min-height: 0; flex: 1; overflow: auto; padding: 17px 21px; outline: 0; color: var(--ui-text); font-size: 13px; line-height: 1.65; }
.editor-content:empty::before { content: "开始输入 Markdown 内容…"; color: var(--ui-subtle); }
.editor-content img { max-width: 100%; height: auto; border: 1px solid var(--ui-line); border-radius: 7px; }
.editor-content pre { padding: 8px; border-radius: 6px; background: var(--ui-code); font-family: Consolas, monospace; font-style: normal; font-weight: 400; white-space: pre-wrap; }
.editor-content pre * { font-family: inherit; font-style: normal; font-weight: 400; }
.editor-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 17px; border-top: 1px solid var(--ui-line); }
.editor-button { width: 32px; height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--ui-line-strong); border-radius: 7px; background: var(--ui-surface); color: var(--ui-muted); }
.editor-button.primary { border-color: var(--ui-button-bg); background: var(--ui-button-bg); color: var(--ui-button-text); }
.multi-tools { display: none; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--ui-muted); font-size: 11px; }.multi-tools.visible { display: flex; }
.select-all { accent-color: var(--ui-accent); }
.multi-button { padding: 5px 9px; border: 1px solid var(--ui-line); border-radius: 6px; background: var(--ui-surface); color: var(--ui-muted); font-size: 11px; }
.multi-button.icon-only { width: 30px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.multi-button:hover, .multi-button:focus-visible { border-color: var(--ui-line-strong); color: var(--ui-accent-strong); }
.multi-button.danger { color: var(--ui-danger); }
.multi-button:disabled { opacity: .45; }
.note-check { display: none; }.multi-mode .note-check { display: inline-block; accent-color: var(--ui-accent); }
.context-menu { position: fixed; z-index: 50; min-width: 148px; padding: 4px; border: 1px solid var(--ui-line-strong); border-radius: 8px; background: var(--ui-surface); box-shadow: var(--ui-shadow); }
.context-menu.hidden { display: none; }
.context-menu button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 0; border-radius: 5px; background: transparent; color: var(--ui-muted); text-align: left; font-size: 11px; }
.context-menu button .lucide { width: 14px; height: 14px; }
.context-menu button:hover, .context-menu button:focus-visible { background: var(--ui-accent-quiet); color: var(--ui-accent-strong); }
.context-menu button:disabled { opacity: .4; }
.context-menu button.danger { color: var(--ui-danger); }
.context-separator { height: 1px; margin: 4px 3px; background: var(--ui-line); }
.floating-add { position: fixed; z-index: 20; right: 24px; bottom: 24px; width: 50px; height: 50px; display: grid; place-items: center; border: 1px solid var(--ui-button-bg); border-radius: 50%; background: var(--ui-button-bg); color: var(--ui-button-text); box-shadow: var(--ui-shadow); font-size: 23px; line-height: 1; }
.floating-add .lucide { width: 22px; height: 22px; }
.floating-add.editor-hidden { display: none; }
.floating-add:hover, .floating-add:focus-visible { transform: translateY(-1px); filter: brightness(1.06); }
@media (max-width: 760px) { .topbar { padding: 0 10px; }.workspace, .workspace.edit-mode { grid-template-columns: 170px minmax(0, 1fr); }.floating-add { right: 16px; bottom: 16px; } }
</style>
</head>
<body>
<div class="app">
  <div class="windowbar" data-windowbar data-windowbar-title="capslock_p2 笔记" data-windowbar-icon="file-text"></div>
  <header class="topbar">
    <div class="search-group"><label class="search" aria-label="搜索标题、正文和标签"><i data-lucide="search"></i><input id="search" type="search" placeholder="搜索标题、正文或标签…"></label><button id="searchButton" class="search-button" type="button" aria-label="搜索"><i data-lucide="search"></i></button></div>
  </header>
  <div id="workspace" class="workspace">
    <aside class="sidebar" aria-label="标签列表">
      <div class="side-heading"><span>标签</span><span id="tagCount" class="side-count"></span></div>
      <div class="tag-actions"><button id="addTag" class="tag-action" type="button" aria-label="添加标签" title="添加标签"><i data-lucide="plus"></i></button><button id="renameTag" class="tag-action" type="button" aria-label="修改标签" title="修改标签"><i data-lucide="pencil"></i></button><button id="deleteTag" class="tag-action" type="button" aria-label="删除标签" title="删除标签"><i data-lucide="trash"></i></button></div>
      <div id="tags" class="tag-list"></div>
    </aside>
    <main id="browse" class="browse" aria-label="笔记预览列表">
      <div class="browse-inner">
        <div class="browse-heading"><h1>最近笔记</h1><span id="noteCount" class="muted"></span></div>
        <div id="multiTools" class="multi-tools"><label><input id="selectAll" class="select-all" type="checkbox"> 全选</label><span id="selectedCount">已选 0</span><button id="multiDelete" class="multi-button danger icon-only" type="button" aria-label="删除所选笔记" title="删除所选笔记" disabled><i data-lucide="trash"></i></button><button id="multiExit" class="multi-button icon-only" type="button" aria-label="退出多选" title="退出多选"><i data-lucide="x"></i></button></div>
        <div id="notes"></div>
      </div>
    </main>
    <main id="editorPage" class="editor-page" aria-label="编辑笔记">
      <section class="editor">
        <div class="editor-head"><button id="editorBack" class="editor-back" type="button" aria-label="返回" title="返回"><i data-lucide="arrow-left"></i></button><input id="editorTitle" class="editor-title" placeholder="标题"></div>
        <div class="editor-tags">
          <span class="editor-tags-label" aria-hidden="true">标签</span>
          <div id="editorTagPicker" class="tag-picker">
            <div id="editorTagChips" class="tag-chips"></div>
            <input id="editorTagInput" placeholder="选择或输入标签" autocomplete="off">
            <div id="editorTagOptions" class="tag-options hidden"></div>
          </div>
        </div>
        <div class="editor-toolbar" aria-label="Markdown 工具栏">
          <button class="tool" type="button" data-command="bold" aria-label="加粗" title="加粗"><i data-lucide="bold"></i></button><button class="tool" type="button" data-command="italic" aria-label="斜体" title="斜体"><i data-lucide="italic"></i></button><button class="tool" type="button" data-command="strike" aria-label="删除线" title="删除线"><i data-lucide="strikethrough"></i></button><button class="tool" type="button" data-command="formatBlock" data-value="h2" aria-label="标题" title="标题"><i data-lucide="heading-2"></i></button><button class="tool" type="button" data-command="formatBlock" data-value="blockquote" aria-label="引用" title="引用"><i data-lucide="quote"></i></button><button class="tool" type="button" data-command="insertUnorderedList" aria-label="无序列表" title="无序列表"><i data-lucide="list"></i></button><button class="tool" type="button" data-command="insertOrderedList" aria-label="有序列表" title="有序列表"><i data-lucide="list-ordered"></i></button><button class="tool" type="button" data-command="formatBlock" data-value="pre" aria-label="代码块" title="代码块"><i data-lucide="code-xml"></i></button><button id="insertImage" class="tool" type="button" aria-label="插入图片" title="插入图片"><i data-lucide="image-plus"></i></button><button class="tool" type="button" data-command="createLink" aria-label="插入链接" title="插入链接"><i data-lucide="link"></i></button>
        </div>
        <div id="editorContent" class="editor-content" contenteditable="true" spellcheck="false"></div>
        <div class="editor-foot"><button id="cancelEdit" class="editor-button icon-only" type="button" aria-label="取消" title="取消"><i data-lucide="x"></i></button><button id="saveEdit" class="editor-button primary icon-only" type="button" aria-label="保存" title="保存"><i data-lucide="check"></i></button></div>
      </section>
    </main>
  </div>
</div>

<button id="addNote" class="floating-add" type="button" aria-label="新增笔记" title="新增笔记"><i data-lucide="plus"></i></button>
<div id="contextMenu" class="context-menu hidden" role="menu" aria-label="笔记操作">
  <button id="contextEdit" type="button" role="menuitem" aria-label="修改" title="修改"><i data-lucide="pencil"></i><span data-label>修改</span></button>
  <button id="contextCopy" type="button" role="menuitem" aria-label="复制" title="复制"><i data-lucide="copy"></i><span data-label>复制</span></button>
  <button id="contextPaste" type="button" role="menuitem" aria-label="粘贴" title="粘贴"><i data-lucide="clipboard-paste"></i><span data-label>粘贴</span></button>
  <button id="contextPin" type="button" role="menuitem" aria-label="置顶" title="置顶"><i data-lucide="pin"></i><span data-label>置顶</span></button>
  <button id="contextDelete" class="danger" type="button" role="menuitem" aria-label="删除" title="删除"><i data-lucide="trash"></i><span data-label>删除</span></button>
  <div class="context-separator"></div>
  <button id="contextMulti" type="button" role="menuitem" aria-label="多选" title="多选"><i data-lucide="list-checks"></i><span data-label>多选</span></button>
</div>
<input id="imageInput" type="file" accept="image/*" multiple hidden>
<script>
WindowBar.init();
const post = payload => { if (window.chrome && chrome.webview) chrome.webview.postMessage(JSON.stringify(payload)); };
window.setPinned = value => WindowBar.setPinned(value);
window.setNativeWindowMode = value => WindowBar.setNativeWindowMode(value);
const $ = id => document.getElementById(id);
const state = { notes: [], tags: [], selectedIds: new Set(), contextNoteId: '', currentTag: '', search: '', editor: null, multi: false, pendingUploads: new Map(), savedRange: null };
let searchTimer = 0;

// Windows hides the pointer while typing when that system option is enabled.
// Native edit controls show it again on mouse movement; report that movement
// so the WebView2 host can restore the same behavior without polling.
let cursorMovePostedAt = 0;
document.addEventListener('mousemove', () => {
  const now = performance.now();
  if (now - cursorMovePostedAt < 80) return;
  cursorMovePostedAt = now;
  post({ type: 'cursorMove' });
}, { passive: true });

function messageValue(value, fallback = '') { return value == null ? fallback : value; }
function toast(text, type = 'info') { if (text) AppToast.show(text, type); }
function submitQuery() { clearTimeout(searchTimer); state.search = $('search').value; post({ type: 'query', text: state.search, tag: state.currentTag }); }
function requestQuery() { clearTimeout(searchTimer); searchTimer = setTimeout(submitQuery, 180); }
function toggleEditor(on) { $('workspace').classList.toggle('edit-mode', on); $('addNote').classList.toggle('editor-hidden', on); }
function escapeExternalImages(markdown) { return String(markdown || '').replace(/!\[([^\]]*)\]\((?!asset:)[^)]*\)/g, '$1'); }
function editorMarkdown(markdown, assets) {
  const lookup = new Map((assets || []).map(asset => [String(asset.id), asset.url]));
  let source = escapeExternalImages(markdown || '');
  source = source.replace(/!\[([^\]]*)\]\(asset:([A-Za-z0-9_-]+)\)/g, (all, alt, id) => lookup.has(id) ? `![${alt}](${lookup.get(id)})` : alt);
  let html = marked.parse(source, { breaks: true, gfm: true });
  html = DOMPurify.sanitize(html, { ADD_ATTR: ['data-asset-id'], FORBID_TAGS: ['script', 'style', 'iframe', 'object', 'embed'] });
  const holder = document.createElement('div'); holder.innerHTML = html;
  holder.querySelectorAll('img').forEach(img => { const src = img.getAttribute('src') || ''; if (!src.startsWith('https://qbar-notes.local/')) { img.replaceWith(document.createTextNode(img.alt || '[图片]')); return; } for (const [id, url] of lookup) if (src === url) img.dataset.assetId = id; });
  return holder.innerHTML;
}
function serializeNode(node, parentTag = '') {
  if (node.nodeType === Node.TEXT_NODE) return node.nodeValue.replace(/\u00a0/g, ' ');
  if (node.nodeType !== Node.ELEMENT_NODE) return '';
  const tag = node.tagName.toLowerCase();
  const children = () => Array.from(node.childNodes).map(child => serializeNode(child, tag)).join('');
  if (tag === 'br') return '\n';
  if (tag === 'img') return node.dataset.assetId ? `![${node.alt || ''}](asset:${node.dataset.assetId})` : (node.alt || '[图片]');
  if (tag === 'strong' || tag === 'b') return `**${children()}**`;
  if (tag === 'em' || tag === 'i') return `*${children()}*`;
  if (tag === 'del' || tag === 's') return `~~${children()}~~`;
  if (tag === 'code' && parentTag !== 'pre') return `\`${node.textContent}\``;
  if (tag === 'pre') { const code = String(node.innerText || node.textContent || '').replace(/\r\n/g, '\n').replace(/\n+$/, ''); return `\n\`\`\`\n${code}\n\`\`\`\n`; }
  if (/^h[1-6]$/.test(tag)) return `\n${'#'.repeat(Number(tag[1]))} ${children().trim()}\n`;
