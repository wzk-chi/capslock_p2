<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>qbar</title>
<link rel="stylesheet" href="theme.css">
<script src="../vendor/lucide/lucide.min.js"></script>
<script src="icons.js"></script>
<script src="../vendor/pinyin-pro/pinyin-pro.js"></script>
<script src="qbar-search.js"></script>
<style>
/* Keep these values in sync with lib/features/qbar/qbar.ahk. The card radius
   also matches the host window's rounded region. */
:root {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;

  /* Geometry shared with the native qbar host. */
  --card-radius: 12px;
  --radius: max(0px, calc(var(--card-radius) - 3px));
  --input-height: 34px;
  --row-height: 30px;
  --padding: 10px;
  --gap: 6px;

  /* Typography and result-list behavior. */
  --input-font-size: 14px;
  --list-font-size: 13px;
  --list-bg: transparent;
  --list-color: var(--text);
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  user-select: none;
}

/* The host clips the window to the outer radius. Keep the visible edge one
   pixel inside that clip so the rounded corners retain the full line. */
#panel {
  height: 100%;
  position: relative;
  padding: var(--padding);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: var(--card-radius);
  background: var(--surface);
}

#panel::before {
  content: "";
  position: absolute;
  inset: 1px;
  border: 1px solid var(--border);
  border-radius: max(0px, calc(var(--card-radius) - 1px));
  pointer-events: none;
}

/* Query input ------------------------------------------------------------ */
#input {
  height: var(--input-height);
  flex: 0 0 auto;
  width: 100%;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font: var(--input-font-size)/1.5 Consolas, "Microsoft YaHei", monospace;
  outline: none;
  box-shadow: 0 2px 8px color-mix(in srgb, var(--text) 10%, transparent);
  user-select: text;
}

#input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
#input:disabled { opacity: .72; cursor: wait; }
#input::placeholder { color: var(--muted); }

/* Loading state ---------------------------------------------------------- */
.loading {
  height: var(--row-height);
  flex: 0 0 auto;
  margin-top: var(--gap);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  color: var(--muted);
  font-size: var(--list-font-size);
}

.loading.hidden { display: none; }

.loading .spinner {
  width: 13px;
  height: 13px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: qbar-spin .8s linear infinite;
}

@keyframes qbar-spin { to { transform: rotate(360deg); } }

/* Results ---------------------------------------------------------------- */
#list {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 0;
  margin-top: var(--gap);
  overflow-x: hidden;
  overflow-y: auto;
  border-radius: var(--radius);
  background: var(--list-bg);
}

#list.hidden { display: none; }

.row {
  height: var(--row-height);
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px;
  border-radius: 7px;
  color: var(--list-color);
  font-size: var(--list-font-size);
  white-space: nowrap;
  overflow: hidden;
  cursor: default;
}

.row .glyph { flex: 0 0 auto; width: 16px; display: grid; place-items: center; opacity: .75; }
.row .glyph img { width: 16px; height: 16px; display: block; margin: 0 auto; }
.row .glyph .lucide { width: 15px; height: 15px; }
.row .text { min-width: 0; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }
.row.selected { background: var(--accent-soft); color: var(--accent); }
.row.selected .glyph { opacity: 1; }
.row:hover { background: var(--accent-quiet); color: var(--accent-strong); }
.row:hover .glyph { opacity: 1; }
.row.selected:hover { background: var(--accent-soft); color: var(--accent); }
.row.pinned .text { font-weight: 650; }

.empty {
  height: var(--row-height);
  display: flex;
  align-items: center;
  padding: 0 10px;
  color: var(--muted);
  font-size: var(--list-font-size);
}

/* Keep the scrollbar quiet so it does not compete with the result rows. */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
  <div id="panel">
    <input id="input" spellcheck="false" autocomplete="off" disabled>
    <div id="loading" class="loading">
      <span class="spinner" aria-hidden="true"></span>
      <span id="loadingText">Loading…</span>
    </div>
    <div id="list" class="hidden"></div>
  </div>
<script>
const input = document.getElementById('input');
const loading = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const list = document.getElementById('list');

const MAX_VISIBLE_ROWS = 12;
const MAX_RENDERED = 60; // rows rendered into the DOM

// Type ranks mirror the reference implementation's ListView column 1.
const TYPE_RANK = { search: -1, everything: -1, notes: -1, folder: 0, file: 1, web: 2, app: 3, ai: 4 };
const TYPE_ICON = {
  search: 'search', everything: 'folder-search', notes: 'notebook-pen',
  folder: 'folder', file: 'file', web: 'globe', app: 'play', ai: 'bot',
  history: 'clock-3'
};

const STRINGS = {
  en: { placeholder: 'Type to search…', loading: 'Loading…' },
  zh: { placeholder: '输入以搜索…', loading: '加载中…' }
};

/* Page state ------------------------------------------------------------- */
let lang = 'en';
let results = [];
let placeholder = ''; // supplied by AHK, already localized (e.g. "(empty folder)")
let selectedIndex = -1;
let listHidden = false;
let folderMode = false; // AHK is listing a directory, so completions splice paths
let resultsMode = 'normal'; // AHK keeps history rows in recent-first order
let reportedRows = -1;
let ICONS = {}; // iconKey -> PNG data URI, pushed by AHK once per key
let loadingVisible = true;
let loadingInputSnapshot = '';
let loadingInputSnapshotSet = false;
let composing = false;
let querySerial = 0;
let currentQueryId = 0;
let queryPending = false;

/* Messaging and sizing -------------------------------------------------- */
function t(key) {
  return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
}

function post(obj) {
  if (window.chrome && chrome.webview)
    chrome.webview.postMessage(JSON.stringify(obj));
}

function postType(type, text = '') {
  post({ type, text });
}

// Tell AHK the page script is alive and how big its viewport is, so a blank
// panel can be told apart from a zero-sized one. Defer this one turn so every
// page entry point, including the search-key builder below, is installed
// before AHK starts the index handshake.
setTimeout(() => postType('ready', window.innerWidth + 'x' + window.innerHeight), 0);

function requestQuery(reason = 'input') {
  if (composing) return;
  currentQueryId = ++querySerial;
  queryPending = true;
  selectedIndex = -1;
  if (resultsMode === 'history') {
    results = [];
    selectedIndex = -1;
    resultsMode = 'normal';
    render();
  }
  post({ type: 'query', text: input.value, queryId: currentQueryId });
}

// Tell AHK how many result rows the native host should reserve below the input.
function reportRows() {
  const rows = visibleRows();
  if (reportedRows === rows)
    return;
  reportedRows = rows;
  postType('resize', String(rows));
}

function visibleRows() {
  if (loadingVisible)
    return 1;
  if (listHidden)
    return 0;
  if (!hasContent())
    return 0;
  return Math.min(Math.max(results.length, 1), MAX_VISIBLE_ROWS);
}

function hasContent() {
  return results.length > 0 || !!placeholder;
}

/* Rendering and selection ------------------------------------------------ */
function sortResults(items) {
  if (resultsMode === 'history')
    return items.slice();
  return items.slice().sort((a, b) => {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    const matchA = Number.isFinite(a.matchRank) ? a.matchRank : 60;
    const matchB = Number.isFinite(b.matchRank) ? b.matchRank : 60;
    if (matchA !== matchB) return matchA - matchB;
    const usageA = Number.isFinite(a.usageScore) ? a.usageScore : 0;
    const usageB = Number.isFinite(b.usageScore) ? b.usageScore : 0;
    if (usageA !== usageB) return usageB - usageA;
    const lastUsedA = Number(a.usageLastUsedUtc) || 0;
    const lastUsedB = Number(b.usageLastUsedUtc) || 0;
    if (lastUsedA !== lastUsedB) return lastUsedB - lastUsedA;
    const rankA = TYPE_RANK[a.type] ?? 9;
    const rankB = TYPE_RANK[b.type] ?? 9;
    if (rankA !== rankB) return rankA - rankB;
    const labelOrder = a.label.localeCompare(b.label);
    if (labelOrder !== 0) return labelOrder;
    const orderA = Number.isFinite(a.searchOrder) ? a.searchOrder : Number.MAX_SAFE_INTEGER;
    const orderB = Number.isFinite(b.searchOrder) ? b.searchOrder : Number.MAX_SAFE_INTEGER;
    return orderA - orderB;
  });
}

function render() {
  list.textContent = '';
  const rows = sortResults(results).slice(0, MAX_RENDERED);

  if (!rows.length) {
    if (placeholder) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = placeholder;
      list.appendChild(empty);
    }
  } else {
    rows.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'row'
        + (item.pinned ? ' pinned' : '')
        + (index === selectedIndex ? ' selected' : '');
      const glyph = document.createElement('span');
      glyph.className = 'glyph';
      const iconSrc = item.icon ? ICONS[item.icon] : '';
      if (iconSrc) {
        const img = document.createElement('img');
        img.src = iconSrc;
        img.alt = '';
        img.draggable = false;
        glyph.appendChild(img);
      } else {
        glyph.appendChild(createIcon(TYPE_ICON[item.type] || 'circle'));
      }
      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = item.label;
      row.appendChild(glyph);
      row.appendChild(text);
      row.addEventListener('mousedown', event => event.preventDefault());
      row.addEventListener('click', () => {
        selectedIndex = index;
        execute(false);
      });
      list.appendChild(row);
    });
  }

  loading.classList.toggle('hidden', !loadingVisible);
  list.classList.toggle('hidden', listHidden || !hasContent());
  if (loadingVisible)
    list.classList.add('hidden');
  refreshIcons();
  reportRows();
}

function select(index) {
  if (queryPending)
    return;
  const rows = sortResults(results).slice(0, MAX_RENDERED);
  if (!rows.length)
    return;
  const count = rows.length;
  selectedIndex = ((index % count) + count) % count;
  const nodes = list.querySelectorAll('.row');
  nodes.forEach((node, i) => node.classList.toggle('selected', i === selectedIndex));
  if (nodes[selectedIndex])
    nodes[selectedIndex].scrollIntoView({ block: 'nearest' });
}

/* Completion and execution ------------------------------------------------ */
// The highlighted row's short key replaces the leaf of a path while a
// directory is being browsed, and replaces the whole line everywhere else.
// Returns the row that was used.
function completeSelected() {
  if (queryPending)
    return null;
  const rows = sortResults(results).slice(0, MAX_RENDERED);
  const row = selectedIndex >= 0 ? rows[selectedIndex] : null;
  if (!row)
    return null;
  input.value = (folderMode && resultsMode !== 'history' ? folderPrefix() : '') + row.short;
  input.setSelectionRange(input.value.length, input.value.length);
  return row;
}

// Everything up to and including the last "\" — what a folder-mode completion
// keeps while replacing the name being typed.
function folderPrefix() {
  const cut = input.value.lastIndexOf('\\');
  return cut >= 0 ? input.value.slice(0, cut + 1) : '';
}

function execute(ctrlHeld) {
  const rows = sortResults(results).slice(0, MAX_RENDERED);
  const row = (!queryPending && !listHidden && selectedIndex >= 0) ? rows[selectedIndex] : null;
  if (queryPending)
    return;
  if (row && row.historyId) {
    post({
      type: 'executeHistory',
      historyId: row.historyId,
      queryId: currentQueryId
    });
    return;
  }
  post({
    type: 'execute',
    text: input.value,
    selected: row ? row.short : '',
    selectedType: row ? row.type : '',
    ctrl: ctrlHeld ? 'true' : 'false'
  });
}

/* AHK -> page ------------------------------------------------------------ */

window.setLanguage = function (language) {
  lang = language === 'zh' ? 'zh' : 'en';
  input.placeholder = t('placeholder');
  if (loadingVisible)
    loadingText.textContent = t('loading');
};

window.setInput = function (text) {
  const nextText = loadingInputSnapshotSet ? loadingInputSnapshot : (text || '');
  loadingInputSnapshot = '';
  loadingInputSnapshotSet = false;
  input.value = nextText;
  // The reference implementation puts the caret in front of the prefilled
  // selection so a command can be typed ahead of it.
  input.setSelectionRange(0, 0);
  requestQuery();
};

window.setLoading = function (on, text) {
  const wasLoading = loadingVisible;
  loadingVisible = !!on;
  input.disabled = loadingVisible;
  if (loadingVisible && !wasLoading) {
    loadingInputSnapshot = input.value;
    loadingInputSnapshotSet = true;
    queryPending = true;
    selectedIndex = -1;
  }
  if (loadingVisible)
    loadingText.textContent = text || t('loading');
  render();
};

window.resetLoadingSnapshot = function () {
  loadingInputSnapshot = '';
  loadingInputSnapshotSet = false;
};

window.focusInput = function () {
  input.focus();
};

// AHK resets the window to its collapsed height on every show, but this page
// keeps its state while hidden. Clear the last reported count so the next
// render re-reports its rows instead of skipping the resize AHK is waiting
// for. Without this, a same-count prefill query can leave the first row
// clipped to a sliver.
window.resetRows = function () {
  reportedRows = -1;
};

// Arm a search engine: keep the trigger and put the caret after it.
window.startSearch = function (shortKey) {
  input.value = (shortKey || '') + ' ';
  input.setSelectionRange(input.value.length, input.value.length);
  input.focus();
  requestQuery();
};

window.setResults = function (items, isFolder, placeholderText, mode, queryId) {
  if (!Number.isInteger(queryId) || queryId !== currentQueryId)
    return;
  results = Array.isArray(items) ? items : [];
  folderMode = !!isFolder;
  resultsMode = mode === 'history' ? 'history' : 'normal';
  placeholder = placeholderText || '';
  selectedIndex = results.length ? 0 : -1;
  queryPending = false;
  loadingVisible = false;
  input.disabled = false;
  render();
};

// Merge icon batches pushed by AHK after rows are already visible.
window.addIcons = function (map) {
  Object.assign(ICONS, map || {});
  render();
};

window.buildQbarSearchKeys = function (payload) {
  if (!window.QbarSearchKeys || typeof window.QbarSearchKeys.start !== 'function') {
    post({
      type: 'searchKeysReady',
      generation: payload && payload.generation,
      ok: false,
      items: [],
      error: 'module_missing'
    });
    return;
  }
  window.QbarSearchKeys.start(payload, message => post(message));
};

/* Input and keyboard handling ------------------------------------------- */

input.addEventListener('compositionstart', () => {
  composing = true;
  currentQueryId = ++querySerial;
  results = [];
  selectedIndex = -1;
  resultsMode = 'normal';
  render();
});

input.addEventListener('compositionend', () => {
  composing = false;
  requestQuery('compositionend');
});

input.addEventListener('input', event => {
  // A fresh query resets the selection; setResults re-selects the first row.
  if (event.isComposing || composing) {
    return;
  }
  requestQuery('input');
});

input.addEventListener('keydown', event => {
  if (event.key === 'Tab') {
    event.preventDefault();
    if (!results.length) return;
    // Hidden list: bring it back. Visible: complete the highlighted row, which
    // is what the reference's Tab does there.
    if (listHidden) {
      listHidden = false;
      render();
      return;
    }
    if (completeSelected()) requestQuery();
    return;
  }
  if ((event.key === '\\' || event.key === '/') && !listHidden && resultsMode !== 'history') {
    // Both keys complete the highlighted row; a folder also drops straight into
    // browsing it, which is what the reference used them for. With nothing to
    // complete they fall through and are typed as ordinary characters.
    const row = completeSelected();
    if (row) {
      if (folderMode && row.type === 'folder') input.value += '\\';
      requestQuery();
      event.preventDefault();
    }
    return;
  }
  if (event.key === 'ArrowDown') {
    event.preventDefault();
    select(selectedIndex + 1);
    return;
  }
  if (event.key === 'ArrowUp') {
    event.preventDefault();
    select(selectedIndex - 1);
    return;
  }
  if (event.key === 'Enter') {
    event.preventDefault();
    execute(event.ctrlKey);
  }
});

// Let the first Esc leave an editor, then use the next Esc to close the panel.
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  const active = document.activeElement;
  if (active && (active.matches('input, textarea, select') || active.isContentEditable)) {
    event.preventDefault();
    active.blur();
    return;
  }
  event.preventDefault();
  postType('hide');
});

input.placeholder = t('placeholder');
loadingText.textContent = t('loading');
</script>
</body>
</html>
