<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>capslock_p2 AI</title>
<style>
:root { color-scheme: light dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text); cursor: default; }
main { height: 100vh; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.topbar { display: flex; align-items: center; gap: 10px; }
h1 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; }
#status { display: none; }
button { border: 0; border-radius: 8px; padding: 7px 14px; background: var(--ui-button-bg); color: var(--ui-button-text); cursor: pointer; font-weight: 600; }
button:hover { background: var(--ui-button-hover); }
button:disabled { background: var(--ui-surface-muted); color: var(--ui-subtle); cursor: wait; }
button.secondary { background: transparent; color: var(--ui-accent); border: 1px solid var(--ui-line-strong); font-weight: 500; }
button.secondary:hover { background: var(--ui-accent-soft); }
button#pinPanel.pinned { background: var(--ui-accent-soft); color: var(--ui-accent-strong); border-color: var(--ui-accent); }
button#pinPanel.pinned:hover { background: var(--ui-accent-quiet); }
#messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
.msg { max-width: 86%; padding: 9px 12px; border-radius: 12px; font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--ui-button-bg); color: var(--ui-button-text); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--ui-surface); border: 1px solid var(--ui-line-strong); border-bottom-left-radius: 4px; white-space: normal; }
.msg.assistant.thinking { align-self: flex-start; color: var(--ui-muted); background: var(--ui-surface-soft); border: 1px dashed var(--ui-line-strong); }
.msg.assistant.error { color: var(--ui-danger); background: var(--ui-danger-soft); border-color: var(--ui-danger); }
/* Markdown content inside assistant bubbles. */
.msg.assistant > :last-child { margin-bottom: 0; }
.msg.assistant p { margin: 0 0 8px; }
.msg.assistant pre { background: var(--ui-code); border: 1px solid var(--ui-line-strong); border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 8px 0; white-space: pre; }
.msg.assistant code { font-family: Consolas, "Courier New", monospace; font-size: 13px; }
.msg.assistant :not(pre) > code { background: var(--ui-code); padding: 1px 4px; border-radius: 4px; }
.msg.assistant ul, .msg.assistant ol { margin: 8px 0; padding-left: 22px; }
.msg.assistant li { margin: 2px 0; }
.msg.assistant blockquote { margin: 8px 0; padding: 2px 10px; border-left: 3px solid var(--ui-line-strong); color: var(--ui-muted); }
.msg.assistant table { border-collapse: collapse; margin: 8px 0; }
.msg.assistant th, .msg.assistant td { border: 1px solid var(--ui-line-strong); padding: 4px 8px; font-size: 13px; }
.msg.assistant a { color: var(--ui-accent); }
.msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 { margin: 10px 0 6px; font-size: 15px; }
.message-row { display: flex; align-items: flex-end; gap: 6px; width: 100%; }
.message-row.user-row { justify-content: flex-end; }
.message-row.assistant-row { justify-content: flex-start; }
.copy-message { flex: 0 0 24px; width: 24px; height: 24px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 0; background: transparent; color: var(--ui-muted); opacity: .8; }
.copy-message[hidden] { display: none !important; }
.copy-message:hover { background: transparent; color: var(--ui-accent); }
.copy-message:disabled { opacity: .35; cursor: default; }
.copy-message.copied { color: var(--ui-success); }
.copy-message .lucide { width: 15px; height: 15px; }
.topbar button, #send { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.composer { display: flex; gap: 10px; align-items: stretch; }
textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; padding: 10px 12px; border: 1px solid var(--ui-line-strong); border-radius: 10px; background: var(--ui-surface); color: var(--ui-text); font: 14px/1.5 Consolas, "Microsoft YaHei", monospace; outline: none; }
textarea:focus { border-color: var(--ui-accent); box-shadow: 0 0 0 3px var(--ui-ring); }
#send { min-width: 58px; align-self: stretch; }
</style>
<link rel="stylesheet" href="theme.css">
<script src="../vendor/lucide/lucide.min.js"></script>
<script src="icons.js"></script>
</head>
<body>
<main id="mainView">
  <div class="topbar">
    <h1 id="appTitle">capslock_p2 AI</h1>
    <span id="status"></span>
    <button id="pinPanel" class="secondary" aria-pressed="false"><i data-lucide="pin"></i><span data-label></span></button>
    <button id="newChat" class="secondary"><i data-lucide="message-square-plus"></i><span data-label></span></button>
    <button id="openSettings" class="secondary"><i data-lucide="settings-2"></i><span data-label></span></button>
  </div>
  <div id="messages"></div>
  <div class="composer">
    <textarea id="input" rows="1" spellcheck="false"></textarea>
    <button id="send"><i data-lucide="send"></i><span data-label></span></button>
  </div>
</main>

<!-- marked + DOMPurify render assistant answers as sanitized markdown. -->
<script src="../vendor/marked.min.js"></script>
<script src="../vendor/purify.min.js"></script>
<script>
const input = document.getElementById('input');
const messages = document.getElementById('messages');
const status = document.getElementById('status');
const sendBtn = document.getElementById('send');
const pinBtn = document.getElementById('pinPanel');
const newChatBtn = document.getElementById('newChat');
const settingsBtn = document.getElementById('openSettings');
const appTitle = document.getElementById('appTitle');

const STRINGS = {
  en: {
    appTitle: 'capslock_p2 AI',
    newChat: 'New chat',
    settings: 'Settings',
    send: 'Send',
    pin: 'Pin',
    unpin: 'Unpin',
    copy: 'Copy',
    copied: 'Copied',
    copyFailed: 'Copy failed',
    thinking: 'Thinking…',
    inputPlaceholder: 'Ask anything. Enter to send, Shift+Enter for a new line.'
  },
  zh: {
    appTitle: 'capslock_p2 AI',
    newChat: '新会话',
    settings: '设置',
    send: '发送',
    pin: '固定',
    unpin: '取消固定',
    copy: '复制',
    copied: '已复制',
    copyFailed: '复制失败',
    thinking: '思考中…',
    inputPlaceholder: '输入问题：Enter 发送，Shift+Enter 换行'
  }
};

let lang = 'en';

function t(key) {
  return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
}

function setButtonLabel(button, text) {
  const label = button.querySelector('[data-label]');
  if (label) label.textContent = text;
  else button.textContent = text;
}

function applyLanguage() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('appTitle');
  appTitle.textContent = t('appTitle');
  setButtonLabel(pinBtn, pinBtn.classList.contains('pinned') ? t('unpin') : t('pin'));
  pinBtn.title = pinBtn.querySelector('[data-label]').textContent;
  pinBtn.setAttribute('aria-label', pinBtn.title);
  setButtonLabel(newChatBtn, t('newChat'));
  setButtonLabel(settingsBtn, t('settings'));
  setButtonLabel(sendBtn, t('send'));
  input.placeholder = t('inputPlaceholder');
}

function post(obj) {
  if (window.chrome && chrome.webview)
    chrome.webview.postMessage(JSON.stringify(obj));
}

function postType(type, text) {
  post({ type: type, text: text || '' });
}

function applyPinnedState(value) {
  const pinned = !!value;
  pinBtn.classList.toggle('pinned', pinned);
  pinBtn.setAttribute('aria-pressed', pinned ? 'true' : 'false');
  setButtonLabel(pinBtn, pinned ? t('unpin') : t('pin'));
  pinBtn.title = pinBtn.querySelector('[data-label]').textContent;
  pinBtn.setAttribute('aria-label', pinBtn.title);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const helper = document.createElement('textarea');
    helper.value = text;
    helper.setAttribute('readonly', '');
    helper.style.position = 'fixed';
    helper.style.opacity = '0';
    document.body.appendChild(helper);
    helper.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch {}
    helper.remove();
    return copied;
  }
}

function createCopyButton(bubble, visible = false) {
  const copyButton = document.createElement('button');
  copyButton.type = 'button';
  copyButton.className = 'copy-message';
  copyButton.hidden = !visible;
  copyButton.disabled = !visible;
  copyButton.title = t('copy');
  copyButton.setAttribute('aria-label', t('copy'));
  copyButton.appendChild(createIcon('copy'));
  copyButton.addEventListener('click', async event => {
    event.preventDefault();
    event.stopPropagation();
    const text = bubble.dataset.raw || '';
    if (!text) return;
    const copied = await copyText(text);
    copyButton.classList.toggle('copied', copied);
    copyButton.title = copied ? t('copied') : t('copyFailed');
    copyButton.setAttribute('aria-label', copyButton.title);
    if (copied) {
      setTimeout(() => {
        copyButton.classList.remove('copied');
        copyButton.title = t('copy');
        copyButton.setAttribute('aria-label', t('copy'));
      }, 1200);
    }
  });
  return copyButton;
}

function createAssistantRow() {
  const row = document.createElement('div');
  row.className = 'message-row assistant-row';
  const bubble = document.createElement('div');
  bubble.className = 'msg assistant';
  const copyButton = createCopyButton(bubble);
  row.appendChild(bubble);
  row.appendChild(copyButton);
  return { row, bubble, copyButton };
}

function assistantCopyButton(bubble) {
  return bubble && bubble.parentElement
    ? bubble.parentElement.querySelector('.copy-message') : null;
}

// Windows hides the pointer while typing when that system option is enabled.
// Native edit controls show it again on mouse movement; report that movement
// so the WebView2 host can restore the same behavior without polling.
let cursorMovePostedAt = 0;
document.addEventListener('mousemove', () => {
  const now = performance.now();
  if (now - cursorMovePostedAt < 80) return;
  cursorMovePostedAt = now;
  postType('cursorMove', '');
}, { passive: true });

function scrollToBottom() {
  messages.scrollTop = messages.scrollHeight;
}

// Diagnostic telemetry contains lengths only, never message content. It lets
// the host compare the accumulated stream with what the page held at finish.
function postStreamDebug(phase, bubble) {
  const raw = bubble ? (bubble.dataset.raw || '') : '';
  const rendered = bubble ? (bubble.textContent || '') : '';
  const requestId = bubble ? (bubble.dataset.streamId || '') : '';
  post({ type: 'streamDebug', phase: phase,
    requestId: requestId,
    rawLength: String(raw.length), renderedLength: String(rendered.length) });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

// Assistant answers arrive as markdown; marked parses it and DOMPurify strips
// anything dangerous from the model output before it becomes HTML.
function renderMarkdown(text) {
  const source = String(text ?? '');
  if (window.marked && window.DOMPurify) {
    try {
      return DOMPurify.sanitize(marked.parse(source, { breaks: true, gfm: true }));
    } catch (error) {
      // fall through to plain text
    }
  }
  return escapeHtml(source).replace(/\r?\n/g, '<br>');
}

/* ---- host -> page ---- */

// The AHK side owns the conversation history and echoes every message back,
// so rendering is purely a mirror of that history.
window.appendMessage = function (role, text) {
  const isUser = role === 'user';
  if (isUser) {
    const row = document.createElement('div');
    row.className = 'message-row user-row';
    const bubble = document.createElement('div');
    bubble.className = 'msg user';
    bubble.dataset.raw = text || '';
    bubble.textContent = text || '';
    row.appendChild(createCopyButton(bubble, true));
    row.appendChild(bubble);
    messages.appendChild(row);
    refreshIcons();
  } else {
    const entry = createAssistantRow();
    entry.bubble.dataset.raw = text || '';
    entry.bubble.innerHTML = renderMarkdown(text);
    entry.copyButton.hidden = !String(text || '');
    entry.copyButton.disabled = !String(text || '');
    messages.appendChild(entry.row);
    refreshIcons();
  }
  scrollToBottom();
};

window.startStreamingMessage = function (requestId) {
  let bubble = messages.querySelector('.msg.assistant.thinking');
  let copyButton = assistantCopyButton(bubble);
  if (!bubble) {
    const entry = createAssistantRow();
    bubble = entry.bubble;
    copyButton = entry.copyButton;
    messages.appendChild(entry.row);
    refreshIcons();
  }
  bubble.className = 'msg assistant streaming thinking';
  bubble.dataset.raw = '';
  bubble.dataset.streamId = String(requestId ?? '');
  bubble.dataset.nextDelta = '1';
  bubble._pendingDeltas = new Map();
  if (copyButton) {
    copyButton.hidden = true;
    copyButton.disabled = true;
    copyButton.classList.remove('copied');
    copyButton.title = t('copy');
    copyButton.setAttribute('aria-label', t('copy'));
  }
  bubble.textContent = t('thinking');
  input.disabled = true;
  sendBtn.disabled = true;
  scrollToBottom();
};

window.appendStreaming = function (requestId, sequence, text) {
  const bubble = messages.querySelector('.msg.assistant.streaming');
  if (!bubble) {
    postStreamDebug('append-missing', null);
    return;
  }
  if (bubble.dataset.streamId !== String(requestId ?? '')) {
    postStreamDebug('append-stale', bubble);
    return;
  }
  if (!(bubble._pendingDeltas instanceof Map))
    bubble._pendingDeltas = new Map();
  const sequenceNumber = Number(sequence);
  if (!Number.isInteger(sequenceNumber) || sequenceNumber < 1)
    return;
  const expected = Number(bubble.dataset.nextDelta || '1');
  if (sequenceNumber < expected)
    return;
  if (sequenceNumber > expected) {
    bubble._pendingDeltas.set(sequenceNumber, text || '');
    return;
  }
  const applyDelta = delta => {
    bubble.dataset.raw += delta || '';
    bubble.dataset.nextDelta = String(Number(bubble.dataset.nextDelta) + 1);
  };
  applyDelta(text);
  while (bubble._pendingDeltas.has(Number(bubble.dataset.nextDelta))) {
    const next = Number(bubble.dataset.nextDelta);
    const delta = bubble._pendingDeltas.get(next);
    bubble._pendingDeltas.delete(next);
    applyDelta(delta);
  }
  bubble.classList.remove('thinking');
  bubble.innerHTML = renderMarkdown(bubble.dataset.raw);
  const copyButton = assistantCopyButton(bubble);
  if (copyButton) {
    copyButton.hidden = true;
    copyButton.disabled = true;
  }
  scrollToBottom();
};

window.finishStreamingMessage = function (requestId, answer) {
  const bubble = messages.querySelector('.msg.assistant.streaming');
  if (!bubble || bubble.dataset.streamId !== String(requestId ?? '')) {
    postStreamDebug('finish-stale', bubble);
    return;
  }
  bubble.dataset.raw = String(answer ?? '');
  bubble._pendingDeltas = new Map();
  bubble.innerHTML = renderMarkdown(bubble.dataset.raw);
  const copyButton = assistantCopyButton(bubble);
  if (copyButton) {
    copyButton.hidden = !bubble.dataset.raw;
    copyButton.disabled = !bubble.dataset.raw;
  }
  postStreamDebug('finish', bubble);
  if (bubble) bubble.classList.remove('streaming', 'thinking');
  status.textContent = '';
  input.disabled = false;
  sendBtn.disabled = false;
  input.focus();
};

window.removeStreamingMessage = function (requestId) {
  const bubble = messages.querySelector('.msg.assistant.streaming');
  if (!bubble || bubble.dataset.streamId !== String(requestId ?? '')) {
    postStreamDebug('remove-stale', bubble);
    return;
  }
  if (bubble.parentElement && bubble.parentElement.classList.contains('message-row'))
    bubble.parentElement.remove();
  else
    bubble.remove();
  input.disabled = false;
  sendBtn.disabled = false;
  input.focus();
};

window.setThinking = function (on) {
  let bubble = messages.querySelector('.msg.assistant.thinking');
  if (on) {
    if (!bubble) {
      const entry = createAssistantRow();
      bubble = entry.bubble;
      messages.appendChild(entry.row);
      refreshIcons();
    }
    bubble.className = 'msg assistant thinking';
    const copyButton = assistantCopyButton(bubble);
    if (copyButton) {
      copyButton.hidden = true;
      copyButton.disabled = true;
    }
    bubble.textContent = t('thinking');
  } else if (bubble) {
    if (bubble.parentElement && bubble.parentElement.classList.contains('message-row'))
      bubble.parentElement.remove();
    else
      bubble.remove();
  }
  scrollToBottom();
};

window.setError = function (text) {
  window.setThinking(false);
  const bubble = document.createElement('div');
  bubble.className = 'msg assistant error';
  bubble.textContent = text || '';
  messages.appendChild(bubble);
  status.textContent = '';
  scrollToBottom();
};

window.newSession = function () {
  messages.textContent = '';
  status.textContent = '';
};

window.trimMessages = function (limit) {
  const bubbles = Array.from(messages.children);
  const keep = Math.max(0, Number(limit) || 0);
  while (bubbles.length > keep)
    bubbles.shift().remove();
};

/* ---- page -> host ---- */

function send() {
  const text = input.value.trim();
  if (!text)
    return;
  // The history lives in AHK; it echoes the user bubble back and answers.
  post({ type: 'ask', text: text });
  input.value = '';
  input.style.height = 'auto';
  input.focus();
}

input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    send();
    return;
  }
});

// Let the first Esc leave an editor, then use the next Esc to close the panel.
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  const active = document.activeElement;
  if (active && (active.matches('input, textarea, select') || active.isContentEditable)) {
    event.preventDefault();
    active.blur();
    return;
  }
  event.preventDefault();
  postType('hide');
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
sendBtn.addEventListener('click', send);

// Links inside answers open in the default browser (the AHK side handles it),
// never navigate this panel away.
messages.addEventListener('click', event => {
  const link = event.target.closest('a');
  if (!link)
    return;
  event.preventDefault();
  post({ type: 'openUrl', text: link.href });
});

newChatBtn.addEventListener('click', () => postType('newSession'));
pinBtn.addEventListener('click', () => postType('togglePinned'));
settingsBtn.addEventListener('click', () => {
  postType('openSettings');
});

// Pushed settings carry the ui language the page should use.
window.onHostSettings = function (s) {
  lang = s && s.uiLanguage === 'zh' ? 'zh' : 'en';
  applyLanguage();
};

window.setPinned = function (value) {
  applyPinnedState(value);
};

applyLanguage();
input.focus();
</script>
</body>
</html>
