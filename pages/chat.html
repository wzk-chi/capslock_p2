<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>capslock_p2 AI</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text); cursor: default; }
main { height: 100vh; min-width: 0; padding: 14px 18px; display: flex; flex-direction: column; gap: 0; }
main > .windowbar { margin: -14px -18px 0; padding-left: 18px; }
.topbar { display: flex; align-items: center; gap: 10px; }
.topbar-spacer { flex: 1; }
h1 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; }
#status { display: none; }
button { border: 0; border-radius: var(--ui-radius-control); padding: 7px 14px; background: var(--ui-button-bg); color: var(--ui-button-text); cursor: pointer; font-weight: 600; }
button:hover { background: var(--ui-button-hover); }
button:disabled { background: var(--ui-surface-muted); color: var(--ui-subtle); cursor: wait; }
button.secondary { background: transparent; color: var(--ui-accent); border: 1px solid var(--ui-line-strong); font-weight: 500; }
button.secondary:hover { background: var(--ui-accent-quiet); }
button#pinPanel.pinned { background: var(--ui-accent-soft); color: var(--ui-accent-strong); border-color: var(--ui-line-strong); }
button#pinPanel.pinned:hover { background: var(--ui-accent-quiet); }
#messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
.msg { max-width: 86%; padding: 9px 12px; border-radius: var(--ui-radius-card); font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--ui-button-bg); color: var(--ui-button-text); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--ui-surface); border: 1px solid var(--ui-line-strong); border-bottom-left-radius: 4px; white-space: normal; }
.msg.assistant.thinking { align-self: flex-start; color: var(--ui-muted); background: var(--ui-surface-soft); border: 1px dashed var(--ui-line-strong); }
.msg.assistant.error { color: var(--ui-danger); background: var(--ui-danger-soft); border-color: var(--ui-danger); }
/* Markdown content inside assistant bubbles. */
.msg.assistant > :last-child { margin-bottom: 0; }
.msg.assistant p { margin: 0 0 8px; }
.msg.assistant pre { background: var(--ui-code); border: 1px solid var(--ui-line-strong); border-radius: var(--ui-radius-control); padding: 8px 10px; overflow-x: auto; margin: 8px 0; white-space: pre; }
.msg.assistant code { font-family: Consolas, "Courier New", monospace; font-size: 13px; }
.msg.assistant :not(pre) > code { background: var(--ui-code); padding: 1px 4px; border-radius: 4px; }
.msg.assistant ul, .msg.assistant ol { margin: 8px 0; padding-left: 22px; }
.msg.assistant li { margin: 2px 0; }
.msg.assistant blockquote { margin: 8px 0; padding: 2px 10px; border-left: 3px solid var(--ui-line-strong); color: var(--ui-muted); }
.msg.assistant table { border-collapse: collapse; margin: 8px 0; }
.msg.assistant th, .msg.assistant td { border: 1px solid var(--ui-line-strong); padding: 4px 8px; font-size: 13px; }
.msg.assistant a { color: var(--ui-accent); }
.msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 { margin: 10px 0 6px; font-size: 15px; }
.message-row { display: flex; align-items: flex-end; gap: 6px; width: 100%; }
.message-row.user-row { justify-content: flex-end; }
.message-row.assistant-row { justify-content: flex-start; }
.copy-message { flex: 0 0 24px; width: 24px; height: 24px; padding: 0; display: grid; place-items: center; border: 0; border-radius: 0; background: transparent; color: var(--ui-muted); opacity: .8; }
.copy-message[hidden] { display: none !important; }
.copy-message:hover { background: transparent; color: var(--ui-accent); }
.copy-message:disabled { opacity: .35; cursor: default; }
.copy-message.copied { color: var(--ui-success); }
.copy-message .lucide { width: 15px; height: 15px; }
.topbar button, #send { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.composer { display: flex; gap: 10px; align-items: stretch; }
textarea { flex: 1; resize: none; min-height: 40px; max-height: 140px; padding: 10px 12px; border: 1px solid var(--ui-line-strong); border-radius: 10px; background: var(--ui-surface); color: var(--ui-text); font: 14px/1.5 Consolas, "Microsoft YaHei", monospace; outline: none; }
textarea:focus { border-color: var(--ui-accent); box-shadow: 0 0 0 3px var(--ui-ring); }
#send { min-width: 58px; align-self: stretch; }
.app-layout { position: relative; display: flex; flex: 1; min-width: 0; min-height: 0; margin: 0 -18px -14px; }
.sidebar { display: flex; flex: 0 0 272px; flex-direction: column; width: 272px; min-width: 0; padding: 10px; border-right: 1px solid var(--ui-line); background: var(--ui-surface-soft); transition: width .16s ease, flex-basis .16s ease; }
.sidebar.is-collapsed { flex-basis: 64px; width: 64px; align-items: center; padding: 10px 7px; }
.sidebar-top { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.sidebar-toggle-row { display: flex; justify-content: flex-end; }
.sidebar.is-collapsed .sidebar-toggle-row { justify-content: center; }
.sidebar-toggle { display: grid; width: 30px; height: 30px; place-items: center; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--ui-muted); }
.sidebar-toggle:hover { background: var(--ui-accent-quiet); color: var(--ui-text); }
.sidebar-actions { display: grid; width: 100%; gap: 5px; }
.sidebar-action { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 0 10px; border: 0; border-radius: var(--ui-radius-control); background: transparent; color: var(--ui-accent); text-align: left; font-weight: 500; }
.sidebar-action:hover { background: var(--ui-accent-quiet); }
.sidebar-action .lucide { width: 16px; height: 16px; }
.sidebar.is-collapsed .sidebar-actions { justify-items: center; gap: 8px; }
.sidebar.is-collapsed .sidebar-action { width: 44px; height: 44px; justify-content: center; padding: 0; }
.sidebar.is-collapsed .sidebar-action .action-label,
.sidebar.is-collapsed .history-section,
.sidebar.is-collapsed .selection-bar { display: none; }
.history-section { display: flex; flex: 1; flex-direction: column; min-height: 0; margin-top: 16px; }
.history-heading { display: flex; align-items: center; justify-content: space-between; min-height: 38px; padding: 0 2px 0 8px; }
.history-heading h2 { margin: 0; font-size: 15px; font-weight: 650; }
.history-multi { display: grid; width: 34px; height: 34px; place-items: center; padding: 0; border: 0; border-radius: var(--ui-radius-control); background: transparent; color: var(--ui-accent); }
.history-multi:hover,.history-multi[aria-pressed="true"] { background: var(--ui-accent-soft); color: var(--ui-accent-strong); }
#historyList { display: grid; flex: 1; align-content: start; gap: 3px; min-height: 0; overflow: auto; margin-top: 5px; padding: 4px; }
.session-row { display: flex; align-items: center; gap: 4px; min-width: 0; border-radius: var(--ui-radius-control); }
.session-row[aria-current="true"] { background: var(--ui-accent-soft); }
.session-open { display: flex; flex: 1; align-items: center; gap: 8px; min-width: 0; min-height: 44px; padding: 4px 8px; border: 0; border-radius: var(--ui-radius-control); background: transparent; color: var(--ui-text); text-align: left; }
.session-open:hover { background: var(--ui-accent-quiet); }
.session-copy { display: grid; flex: 1; gap: 2px; min-width: 0; }
.session-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-time { color: var(--ui-muted); font-size: 12px; }
.empty-history { padding: 10px 8px; color: var(--ui-muted); font-size: 13px; }
.session-pin { display: none; flex: 0 0 auto; color: var(--ui-accent); }
.session-row[data-pinned="true"] .session-pin { display: block; }
.session-check { display: none; width: 17px; height: 17px; margin: 0 6px; accent-color: var(--ui-accent); }
.sidebar.is-selecting .session-check { display: block; }
.sidebar.is-selecting .session-open { order: 2; }
.sidebar.is-selecting .session-check { order: 1; }
.session-row:focus-within { outline: 2px solid var(--ui-accent); outline-offset: 1px; }
#historyList .session-open:focus-visible { outline-offset: -2px; }
.selection-bar { display: flex; align-items: center; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--ui-line); }
.selection-bar[hidden] { display: none; }
.selection-count { flex: 1; min-width: 0; color: var(--ui-muted); }
.selection-bar button { min-height: 34px; padding: 0 8px; border: 0; border-radius: var(--ui-radius-control); background: transparent; color: var(--ui-text); }
.selection-bar button:hover { background: var(--ui-accent-quiet); }
.selection-bar .danger-action { color: var(--ui-danger); }
.selection-bar .danger-action:disabled { cursor: not-allowed; }
.chat-panel { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; }
.chat-head { display: flex; align-items: center; min-height: 48px; padding: 0 18px; border-bottom: 1px solid var(--ui-line); }
.chat-head h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#loadOlder { align-self: center; margin: 8px 0 0; padding: 5px 10px; border: 1px solid var(--ui-line-strong); border-radius: var(--ui-radius-control); background: transparent; color: var(--ui-accent); font-weight: 500; }
#loadOlder:hover { background: var(--ui-accent-quiet); }
.context-menu { position: absolute; z-index: 20; display: grid; width: 190px; padding: 5px; border: 1px solid var(--ui-line-strong); border-radius: 9px; background: var(--ui-surface-raised); box-shadow: var(--ui-shadow-soft); }
.context-menu[hidden] { display: none; }
.context-menu button { display: flex; align-items: center; gap: 9px; min-height: 36px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ui-text); text-align: left; font-weight: 500; }
.context-menu button:hover { background: var(--ui-accent-quiet); }
.context-menu .menu-divider { height: 1px; margin: 4px 5px; background: var(--ui-line); }
.context-menu .menu-delete { color: var(--ui-danger); }
#saveRetry { display: grid; gap: 6px; max-height: 140px; overflow: auto; margin: 0 18px 8px; padding: 8px 10px; border-radius: var(--ui-radius-control); background: var(--ui-warning-soft); color: var(--ui-text); font-size: 13px; }
#saveRetry[hidden] { display: none; }
.save-retry-item { display: flex; align-items: center; gap: 10px; }
.save-retry-message { flex: 1; min-width: 0; }
.retry-save { flex: 0 0 auto; padding: 5px 10px; border: 1px solid var(--ui-line-strong); border-radius: var(--ui-radius-control); background: var(--ui-surface); color: var(--ui-accent); font-weight: 500; }
.retry-save:hover { background: var(--ui-accent-quiet); }
.composer { padding: 0 18px 14px 2px; }
@media (max-width: 650px) {
  .sidebar:not(.is-collapsed) { flex-basis: 220px; width: 220px; }
  .chat-head { padding-inline: 12px; }
  #messages { padding-inline: 12px; }
  .composer { padding-inline: 12px; }
}
</style>
<link rel="stylesheet" href="theme.css">
<script src="toast.js"></script>
<script src="dialog.js"></script>
<script src="../vendor/lucide/lucide.min.js"></script>
<script src="icons.js"></script>
<script src="windowbar.js"></script>
<script src="panel.js"></script>
</head>
<body>
<main id="mainView">
  <div class="windowbar" data-windowbar data-windowbar-title="capslock_p2 AI" data-windowbar-icon="bot"></div>
  <div class="app-layout" id="appLayout">
    <aside class="sidebar is-collapsed" id="sidebar" aria-label="AI 会话侧栏">
      <div class="sidebar-top">
        <div class="sidebar-toggle-row">
          <button class="sidebar-toggle" id="toggleSidebar" type="button" aria-label="展开侧栏" aria-expanded="false">
            <i data-lucide="panel-left-open" aria-hidden="true"></i>
          </button>
        </div>
        <div class="sidebar-actions">
          <button class="sidebar-action" id="newChat" type="button" aria-label="新建对话">
            <i data-lucide="message-square-plus" aria-hidden="true"></i><span class="action-label" data-label></span>
          </button>
          <button class="sidebar-action" id="openSettings" type="button" aria-label="设置">
            <i data-lucide="settings-2" aria-hidden="true"></i><span class="action-label" data-label></span>
          </button>
        </div>
      </div>
      <section class="history-section" aria-label="会话历史">
        <div class="history-heading">
          <h2 id="historyHeading"></h2>
          <button class="history-multi" id="multiSelect" type="button" aria-label="进入多选" aria-pressed="false">
            <i data-lucide="list-checks" aria-hidden="true"></i>
          </button>
        </div>
        <div id="historyList" role="list" aria-labelledby="historyHeading"></div>
        <div class="selection-bar" id="selectionBar" hidden aria-live="polite">
          <span class="selection-count" id="selectionCount"></span>
          <button id="selectAllSessions" type="button"></button>
          <button class="danger-action" id="deleteSelectedSessions" type="button"></button>
          <button id="exitMultiSelect" type="button"></button>
        </div>
      </section>
    </aside>

    <section class="chat-panel" aria-label="AI 问答">
      <div class="chat-head">
        <h1 id="currentTitle">新对话</h1>
        <span id="status" hidden></span>
      </div>
      <button id="loadOlder" type="button" hidden></button>
      <div id="messages" aria-live="polite"></div>
      <div id="saveRetry" hidden role="status" aria-live="polite"></div>
      <div class="composer">
        <textarea id="input" rows="1" spellcheck="false"></textarea>
        <button id="send"><i data-lucide="send"></i><span data-label></span></button>
      </div>
    </section>

    <div class="context-menu" id="sessionContextMenu" role="menu" aria-label="会话操作" hidden>
      <button type="button" role="menuitem" data-menu-action="rename"><i data-lucide="pencil" aria-hidden="true"></i><span data-label="rename"></span></button>
      <button type="button" role="menuitem" data-menu-action="pin"><i data-lucide="pin" aria-hidden="true"></i><span data-label="pin"></span></button>
      <div class="menu-divider" role="separator"></div>
      <button class="menu-delete" type="button" role="menuitem" data-menu-action="delete"><i data-lucide="trash-2" aria-hidden="true"></i><span data-label="delete"></span></button>
    </div>
  </div>
</main>

<!-- marked + DOMPurify render assistant answers as sanitized markdown. -->
<script src="../vendor/marked.min.js"></script>
<script src="../vendor/purify.min.js"></script>
<script src="chat.js"></script>
</body>
</html>
