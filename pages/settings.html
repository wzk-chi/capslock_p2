<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>capslock_p2 设置</title>
<style>
:root {
  color-scheme: light dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
body.settings-saving { pointer-events: none; }
.app { height: 100%; display: flex; overflow: hidden; }
.side {
  width: 224px; flex: none; padding: 25px 14px 16px;
  border-right: 1px solid var(--ui-line); background: var(--ui-surface);
  display: flex; flex-direction: column;
}
.brand { padding: 0 12px 24px; }
.brand strong { color: var(--ui-accent); font-size: 17px; letter-spacing: .2px; }
.brand span { display: block; margin-top: 4px; color: var(--ui-muted); font-size: 12px; }
.nav { display: grid; gap: 4px; }
.nav button {
  width: 100%; display: flex; align-items: center; gap: 9px; border: 0; border-radius: 9px; padding: 10px 12px;
  background: transparent; color: var(--ui-muted); text-align: left; font-size: 13px;
}
.nav button .lucide { width: 16px; height: 16px; }
.nav button:hover { background: var(--ui-surface-soft); color: var(--ui-text); }
.nav button.active { background: var(--ui-accent-soft); color: var(--ui-accent); font-weight: 650; }
.side-foot { margin-top: auto; padding: 10px 12px 0; color: var(--ui-muted); font-size: 11px; }
.main { min-width: 0; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.topbar {
  height: 76px; flex: none; display: flex; align-items: center; justify-content: space-between;
  gap: 18px; padding: 0 34px; border-bottom: 1px solid var(--ui-line); background: var(--ui-surface);
}
.title { min-width: 0; display: flex; align-items: center; gap: 10px; }
.title h1 { margin: 0; font-size: 20px; font-weight: 650; white-space: nowrap; }
.status { margin: 0; min-height: 0; color: var(--ui-muted); font-size: 12px; white-space: nowrap; }
.status.error { color: var(--ui-danger); }
.actions { display: flex; gap: 8px; }
.btn {
  border: 0; border-radius: var(--ui-radius-control); padding: 8px 15px; background: var(--ui-button-bg); color: var(--ui-button-text);
  font-size: 12px; font-weight: 650;
}
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--ui-muted); border: 1px solid var(--ui-line); }
.btn.ghost:hover { color: var(--ui-text); background: var(--ui-surface-soft); }
.content { flex: 1; overflow: auto; padding: 28px 34px 42px; }
.page { display: none; max-width: 1020px; margin: 0 auto; }
.page.active { display: block; }
.cards { display: grid; gap: 14px; }
.card {
  padding: 18px 20px; border: 1px solid var(--ui-line); border-radius: 13px;
  background: var(--ui-surface); box-shadow: var(--ui-shadow);
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
.card h3 { margin: 0; font-size: 13px; font-weight: 650; }
.card-head .btn { padding: 6px 10px; font-size: 11px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.field { min-width: 0; display: grid; gap: 5px; }
.field.wide, .grid.wide { grid-column: 1 / -1; }
.field label, .field > span { color: var(--ui-muted); font-size: 11px; }
.secret-control {
  min-width: 0; display: flex; align-items: center; gap: 2px;
  border: 1px solid var(--ui-line); border-radius: var(--ui-radius-control);
  background: var(--ui-surface); transition: border-color .15s ease, box-shadow .15s ease;
}
.secret-control:focus-within { border-color: var(--ui-accent); box-shadow: 0 0 0 3px var(--ui-accent-soft); }
.secret-control input, .secret-control input:focus {
  min-width: 0; flex: 1; width: 0; height: 36px; border: 0; border-radius: inherit;
  padding: 8px 10px; outline: 0; background: transparent; box-shadow: none;
}
.secret-control input::placeholder { color: var(--ui-subtle); letter-spacing: .09em; opacity: .9; }
.secret-control input::-ms-reveal, .secret-control input::-ms-clear { display: none; }
.secret-actions { flex: none; display: flex; align-items: center; gap: 1px; padding-right: 4px; }
.secret-action {
  width: 30px; height: 30px; display: grid; place-items: center; padding: 0;
  border: 0; border-radius: 7px; background: transparent; color: var(--ui-muted);
}
.secret-action .lucide { width: 16px; height: 16px; }
.secret-action:hover:not(:disabled) { background: var(--ui-accent-soft); color: var(--ui-accent-strong); }
.secret-action:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 1px; }
.secret-action:disabled { opacity: .38; cursor: default; }
.secret-clear:hover:not(:disabled) { background: var(--ui-danger-soft); color: var(--ui-danger); }
input, select, textarea {
  width: 100%; border: 1px solid var(--ui-line); border-radius: var(--ui-radius-control); padding: 8px 10px;
  outline: none; background: var(--ui-surface); color: var(--ui-text); font-size: 12px;
}
textarea { min-height: 76px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--ui-accent); box-shadow: 0 0 0 3px var(--ui-accent-soft); }
[hidden] { display: none !important; }
.check { display: flex; align-items: center; gap: 8px; min-height: 34px; color: var(--ui-text); font-size: 12px; }
.check input { width: 15px; height: 15px; accent-color: var(--ui-accent); }
.hint { color: var(--ui-muted); font-size: 11px; }
.pair-list, .shortcut-list, .binding-list { display: grid; gap: 7px; }
.pair-row, .shortcut-row {
  display: grid; grid-template-columns: 150px minmax(0, 1fr) 32px; gap: 8px; align-items: center;
}
.pair-row textarea { min-height: 38px; }
#tabList .pair-row > input, #tabList .pair-row > textarea { height: 38px; min-height: 38px; resize: none; }
.custom-hotkey-row { grid-template-columns: minmax(0, .9fr) minmax(0, 1.3fr) 32px; gap: 14px; align-items: end; }
.custom-hotkey-field { min-width: 0; display: grid; gap: 5px; }
.custom-hotkey-field > span { color: var(--ui-muted); font-size: 11px; }
.custom-hotkey-control { min-width: 0; display: flex; align-items: center; gap: 6px; }
.custom-hotkey-control input { min-width: 0; flex: 1; height: 38px; }
.custom-hotkey-control select { width: 132px; flex: none; height: 38px; padding: 6px 8px; }
.custom-hotkey-control select.custom-hotkey-action { min-width: 0; width: auto; flex: 1; }
.custom-hotkey-control input:disabled { color: var(--ui-muted); cursor: default; }
.custom-hotkey-record { flex: none; padding: 6px 8px; font-size: 11px; }
.custom-hotkey-empty { padding: 12px 2px; color: var(--ui-muted); font-size: 12px; }
.shortcut-row { grid-template-columns: 180px minmax(0, 1fr) minmax(48px, auto); }
.shortcut-row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
.shortcut-label { color: var(--ui-muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shortcut-record { padding: 6px 7px; font-size: 11px; white-space: nowrap; }
.shortcut-record.recording { background: var(--ui-danger); }
.shortcut-empty, .custom-hotkey-filter-empty { padding: 12px 2px; color: var(--ui-muted); font-size: 12px; }
.shortcut-list { gap: 0; }
.shortcut-group { border-bottom: 1px solid var(--ui-line); }
.shortcut-group:last-child { border-bottom: 0; }
.shortcut-group summary { display: flex; align-items: center; gap: 8px; padding: 12px 3px; cursor: pointer; list-style: none; user-select: none; color: var(--ui-text); font-size: 12px; font-weight: 650; }
.shortcut-group summary::-webkit-details-marker { display: none; }
.shortcut-group .summary-icon { color: var(--ui-muted); width: 16px; height: 16px; transition: transform .15s ease; }
.shortcut-group[open] .summary-icon { transform: rotate(90deg); }
.shortcut-group-count { margin-left: auto; color: var(--ui-muted); font-size: 11px; font-weight: 500; }
.shortcut-group-list { display: grid; gap: 7px; padding: 0 3px 13px; }
.hotkey-scope-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 14px; padding-bottom: 14px; }
.hotkey-scope-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hotkey-scope-head h3 { margin: 0; font-size: 13px; font-weight: 650; }
.hotkey-scope-actions { display: flex; align-items: center; gap: 8px; }
.hotkey-overrides-filter[aria-pressed="true"] { border-color: var(--ui-accent); background: var(--ui-accent-soft); color: var(--ui-accent); }
.hotkey-scope-button { min-width: 220px; display: flex; align-items: center; gap: 9px; text-align: left; }
.hotkey-scope-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hotkey-scope-status { color: var(--ui-muted); font-size: 10px; font-weight: 500; }
.hotkey-scope-button .lucide { width: 14px; height: 14px; color: var(--ui-muted); }
.hotkey-application-dialog { width: min(680px, calc(100% - 32px)); }
.hotkey-application-dialog .picker-table th:last-child,
.hotkey-application-dialog .picker-table td:last-child { width: 170px; text-align: right; }
.hotkey-application-dialog .picker-table td:first-child { cursor: pointer; }
.hotkey-app-name { display: grid; gap: 3px; min-width: 0; }
.hotkey-app-name strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hotkey-app-path { display: block; min-height: 1.35em; color: var(--ui-muted); font-size: 10px; overflow-wrap: anywhere; }
.hotkey-app-status { color: var(--ui-accent); font-size: 11px; white-space: nowrap; }
.hotkey-app-status.off { color: var(--ui-muted); }
.hotkey-app-actions { display: flex; justify-content: flex-end; gap: 6px; }
.hotkey-app-actions .btn { padding: 5px 8px; font-size: 11px; }
.hotkey-global-row { cursor: pointer; }
.hotkey-global-row td { background: var(--ui-surface); }
.hotkey-global-row:hover td, .hotkey-application-dialog .picker-table tbody tr:hover td { background: var(--ui-accent-soft); }
.icon-btn { border: 0; border-radius: 7px; padding: 6px; background: transparent; color: var(--ui-muted); font-size: 16px; }
.icon-btn:hover { background: var(--ui-accent-quiet); color: var(--ui-accent); }
.list-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
.mini { padding: 6px 10px; font-size: 11px; }
.filter { margin-bottom: 12px; }
.binding-card { display: grid; gap: 10px; padding: 13px; border: 1px solid var(--ui-line); border-radius: 10px; background: var(--ui-surface-soft); }
.binding-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.binding-number { min-width: 86px; font-size: 12px; font-weight: 650; }
.binding-head select { max-width: 150px; padding: 6px 8px; }
.binding-actions { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.binding-actions .btn { padding: 6px 10px; font-size: 11px; }
.binding-mode-hint { color: var(--ui-muted); font-size: 11px; }
.binding-items { display: grid; gap: 4px; color: var(--ui-muted); font-size: 11px; overflow-wrap: anywhere; }
.plugin-list { display: grid; gap: 10px; }
.plugin-card { display: grid; gap: 9px; padding: 12px; border: 1px solid var(--ui-line); border-radius: 10px; background: var(--ui-surface-soft); }
.plugin-card-head, .plugin-command-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.plugin-card-head strong, .plugin-command-head strong { font-size: 12px; }
.plugin-card-head .check { margin-left: auto; }
.plugin-command { display: grid; gap: 6px; padding-top: 8px; border-top: 1px solid var(--ui-line); }
.plugin-alias-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.plugin-alias { display: inline-flex; align-items: center; gap: 3px; max-width: 220px; }
.plugin-alias input { width: 120px; padding: 5px 7px; }
.plugin-alias .icon-btn { padding: 3px; }
.plugin-command-meta { color: var(--ui-muted); font-size: 10px; }
.plugin-list-header, .plugin-list-row {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, .8fr) 74px;
  gap: 12px; align-items: center;
}
.plugin-list-header {
  padding: 0 12px 5px; color: var(--ui-muted); font-size: 10px; font-weight: 650;
}
.plugin-list-row {
  width: 100%; border: 1px solid var(--ui-line); border-radius: 10px; padding: 12px;
  background: var(--ui-surface-soft); color: var(--ui-text); font: inherit; text-align: left;
  cursor: pointer;
}
.plugin-list-row:hover { border-color: var(--ui-accent); background: var(--ui-accent-quiet); }
.plugin-list-name { min-width: 0; font-size: 12px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plugin-list-command { min-width: 0; color: var(--ui-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plugin-list-status { justify-self: end; color: var(--ui-accent); font-size: 11px; white-space: nowrap; }
.plugin-list-status.off { color: var(--ui-muted); }
.plugin-detail { display: grid; gap: 14px; }
.plugin-detail-head { display: flex; align-items: center; gap: 10px; }
.plugin-detail-head strong { font-size: 13px; }
.plugin-detail-section { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--ui-line); }
.plugin-detail-section > strong { font-size: 12px; }
.plugin-detail-section .hint { margin: 0; }
.qbar-plugin-tables { display: grid; gap: 14px; }
.qbar-plugin-table-card { padding: 18px 20px; border: 1px solid var(--ui-line); border-radius: 13px; background: var(--ui-surface); box-shadow: var(--ui-shadow); }
.qbar-plugin-table-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.qbar-plugin-table-head h3 { margin: 0; font-size: 13px; font-weight: 650; }
.qbar-plugin-table-wrap { overflow-x: auto; border: 1px solid var(--ui-line); border-radius: 10px; }
.qbar-plugin-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
.qbar-plugin-table th, .qbar-plugin-table td { padding: 10px 12px; border-bottom: 1px solid var(--ui-line); text-align: left; }
.qbar-plugin-table th { background: var(--ui-surface-soft); color: var(--ui-muted); font-size: 10px; font-weight: 650; }
.qbar-plugin-table th:nth-child(3), .qbar-plugin-table td:nth-child(3) { width: 76px; }
.qbar-plugin-table th:last-child, .qbar-plugin-table td:last-child { width: 96px; text-align: right; }
.qbar-plugin-table tbody tr { cursor: pointer; }
.qbar-plugin-table tbody tr:hover td { background: var(--ui-accent-quiet); }
.qbar-plugin-table tbody tr:last-child td { border-bottom: 0; }
.qbar-plugin-table td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qbar-plugin-table td:last-child { overflow: visible; text-overflow: clip; }
.qbar-plugin-table .tool-name { font-weight: 650; }
.qbar-plugin-table .tool-command { color: var(--ui-muted); }
.qbar-plugin-table .tool-status { color: var(--ui-accent); white-space: nowrap; }
.qbar-plugin-table .tool-status.off { color: var(--ui-muted); }
.qbar-plugin-table .tool-action-empty { color: var(--ui-muted); text-align: right; }
.qbar-plugin-delete { display: inline-flex; align-items: center; gap: 4px; padding: 5px 8px; background: var(--ui-danger-soft); color: var(--ui-danger); }
.qbar-plugin-delete:hover { filter: brightness(1.04); }
.qbar-plugin-delete .lucide { width: 13px; height: 13px; }
.qbar-delete-dialog .app-dialog-editor { display: block; min-height: auto; }
.app-dialog-editor > .grid,
.app-dialog-editor > .plugin-detail-section {
  padding: 14px; border: 1px solid var(--ui-line); border-radius: var(--ui-radius-card); background: var(--ui-surface-soft);
}
.app-dialog-editor > .plugin-detail-section { border-top: 1px solid var(--ui-line); }
.app-dialog-editor .plugin-detail-section > strong { font-size: 12px; }
.app-dialog-editor .plugin-detail-section .hint { margin: -2px 0 2px; line-height: 1.45; }
.app-dialog-editor .plugin-alias-list {
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
  padding: 10px; border: 1px dashed var(--ui-line-strong); border-radius: 10px; background: var(--ui-surface);
}
.app-dialog-editor .plugin-alias { max-width: none; }
.app-dialog-editor .plugin-alias input { width: 128px; height: 34px; }
.empty { padding: 24px; border: 1px dashed var(--ui-line); border-radius: 10px; color: var(--ui-muted); text-align: center; font-size: 12px; }
.picker-dialog .app-dialog-editor { grid-template-rows: auto minmax(0, 1fr); }
.picker-dialog-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.picker-dialog-meta span { color: var(--ui-muted); font-size: 11px; white-space: nowrap; }
.picker-description { margin: 0; color: var(--ui-muted); font-size: 12px; }
.picker-table-wrap { min-height: 180px; max-height: 430px; overflow: auto; border: 1px solid var(--ui-line); border-radius: 10px; }
.picker-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 12px; }
.picker-table th { position: sticky; top: 0; z-index: 1; padding: 9px 10px; border-bottom: 1px solid var(--ui-line-strong); background: var(--ui-surface-soft); color: var(--ui-muted); text-align: left; font-size: 11px; font-weight: 650; }
.picker-table td { max-width: 0; overflow: hidden; padding: 9px 10px; border-bottom: 1px solid var(--ui-line); color: var(--ui-text); line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
.picker-table tbody tr { cursor: pointer; }
.picker-table tbody tr:hover td { background: var(--ui-accent-quiet); }
.picker-table tbody tr.selected td { background: var(--ui-accent-soft); color: var(--ui-accent-strong); }
.picker-table tbody tr:last-child td { border-bottom: 0; }
.picker-empty { display: none; padding: 34px 16px; color: var(--ui-muted); text-align: center; font-size: 12px; }
.picker-empty.visible { display: block; }
@media (max-width: 820px) {
  .side { width: 178px; }
  .topbar { padding: 0 20px; }
  .content { padding: 22px 20px 32px; }
  .grid { grid-template-columns: 1fr; }
  .field.wide { grid-column: auto; }
  .shortcut-row { grid-template-columns: 135px minmax(0, 1fr) minmax(48px, auto); }
  .custom-hotkey-row { grid-template-columns: minmax(0, 1fr) 32px; }
  .custom-hotkey-field:nth-child(2) { grid-column: 1; }
  .custom-hotkey-remove { grid-column: 2; grid-row: 1 / span 2; }
}
</style>
<link rel="stylesheet" href="theme.css">
<script src="toast.js"></script>
<script src="../vendor/lucide/lucide.min.js"></script>
<script src="icons.js"></script>
<script src="dialog.js"></script>
<script src="panel.js"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><strong>capslock_p2</strong><span>设置中心</span></div>
    <nav class="nav" id="nav">
      <button class="active" data-page="general"><i data-lucide="sliders-horizontal"></i><span>通用</span></button>
      <button data-page="mouse"><i data-lucide="mouse-pointer-2"></i><span>鼠标</span></button>
      <button data-page="llm"><i data-lucide="cpu"></i><span>LLM</span></button>
      <button data-page="translate"><i data-lucide="languages"></i><span>翻译</span></button>
      <button data-page="ai"><i data-lucide="message-circle-question-mark"></i><span>AI 问答</span></button>
      <button data-page="shortcuts"><i data-lucide="keyboard"></i><span>快捷键</span></button>
      <button data-page="tab"><i data-lucide="text-cursor-input"></i><span>Tab 替换</span></button>
      <button data-page="qbar"><i data-lucide="search"></i><span>qbar</span></button>
      <button data-page="windows"><i data-lucide="app-window"></i><span>窗口绑定</span></button>
    </nav>
    <div class="side-foot"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title"><h1 id="pageTitle">通用</h1><div id="status" class="status"></div></div>
      <div class="actions"><button id="cancelBtn" class="btn ghost">取消</button><button id="saveBtn" class="btn" disabled>保存</button></div>
    </header>

    <div class="content">
      <section class="page active" data-page-view="general">
        <div class="cards settings-groups"></div>
      </section>

      <section class="page" data-page-view="mouse">
        <div class="cards settings-groups"></div>
      </section>

      <section class="page" data-page-view="llm">
        <div class="cards settings-groups"></div>
      </section>

      <section class="page" data-page-view="translate">
        <div class="cards settings-groups"></div>
      </section>

      <section class="page" data-page-view="ai">
        <div class="cards settings-groups"></div>
      </section>

      <section class="page" data-page-view="shortcuts">
        <div class="cards">
          <div class="card hotkey-scope-card">
            <div class="hotkey-scope-head"><h3>应用范围</h3></div>
            <div class="hotkey-scope-actions">
              <button id="hotkeyOverridesOnly" class="btn ghost mini hotkey-overrides-filter" type="button"
                aria-label="仅查看此应用修改的快捷键" aria-pressed="false" hidden>仅看修改项</button>
              <button id="hotkeyScopeButton" class="btn ghost hotkey-scope-button" type="button" aria-label="选择快捷键范围">
                <span id="hotkeyScopeName" class="hotkey-scope-name">全局</span>
                <span id="hotkeyScopeStatus" class="hotkey-scope-status" hidden>已停用</span>
                <i data-lucide="chevron-down"></i>
              </button>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h3>自定义快捷键</h3><button id="addCustomHotkey" class="btn mini">添加快捷键</button></div>
            <div id="customHotkeyList" class="pair-list"></div>
          </div>
          <div class="card"><input id="shortcutFilter" class="filter" placeholder="筛选快捷键"><div id="shortcutList" class="shortcut-list"></div></div>
        </div>
      </section>

      <section class="page" data-page-view="tab">
        <div class="card"><div id="tabList" class="pair-list"></div><div class="list-actions"><button class="btn mini" data-add-pair="TabHotString">添加替换</button></div></div>
      </section>
