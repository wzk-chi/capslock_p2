<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>capslock_p2 剪贴板历史</title>
<link rel="stylesheet" href="theme.css">
<script src="toast.js"></script>
<script src="../vendor/lucide/lucide.min.js"></script>
<script src="icons.js"></script>
<script src="dialog.js"></script>
<script src="windowbar.js"></script>
<script src="panel.js"></script>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--ui-bg); color: var(--ui-text); }
button, input { font: inherit; }
button { cursor: pointer; }
.app { height: 100%; display: flex; flex-direction: column; }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 18px; min-height: 46px; border-bottom: 1px solid var(--ui-line); background: var(--ui-surface); }
.search { min-width: 160px; flex: 1; height: 33px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid var(--ui-line-strong); border-radius: var(--ui-radius-control); background: var(--ui-surface-soft); }
.search .lucide { width: 15px; height: 15px; color: var(--ui-muted); }
.search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ui-text); font-size: 12px; }
.search input::placeholder { color: var(--ui-subtle); }
.date-filter { flex: none; width: 128px; height: 33px; padding: 0 8px; border: 1px solid var(--ui-line-strong); border-radius: var(--ui-radius-control); background: var(--ui-surface-soft); color: var(--ui-text); font-size: 11px; outline: none; }
.date-filter:focus { border-color: var(--ui-accent); box-shadow: 0 0 0 3px var(--ui-ring); }
.filters { flex: none; display: flex; align-items: center; gap: 5px; padding: 9px 18px; border-bottom: 1px solid var(--ui-line); background: var(--ui-surface); overflow-x: auto; }
.filter { min-width: 54px; height: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 10px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--ui-muted); font-size: 11px; white-space: nowrap; }
.filter .lucide { width: 14px; height: 14px; }
.filter:hover { background: var(--ui-accent-quiet); color: var(--ui-text); }
.filter.active { border-color: var(--ui-line-strong); background: var(--ui-accent-soft); color: var(--ui-accent-strong); font-weight: 650; }
.filter.favorite { margin-left: 0; }
.content { min-height: 0; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
#list { min-height: 0; flex: 1; overflow-y: auto; padding: 7px 9px 12px; outline: none; }
.history-row { position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 66px; max-height: 320px; overflow: hidden; padding: 9px 11px; border: 1px solid transparent; border-radius: 9px; cursor: pointer; }
.history-row:hover { background: var(--ui-accent-quiet); }
.history-row[draggable="true"] { cursor: default; }
.history-row.selected { border-color: var(--ui-line-strong); background: var(--ui-accent-soft); }
.history-row.multi-selected { border-color: var(--ui-accent-strong); background: var(--ui-accent-soft); }
.type-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--ui-radius-control); background: var(--ui-surface-muted); color: var(--ui-accent-strong); font-size: 19px; }
.type-icon .select-check, .type-icon .select-empty { width: 17px; height: 17px; }
.type-icon .select-check { display: none; }
.history-row.multi-selected .type-icon .select-check { display: block; }
.history-row.multi-selected .type-icon .select-empty { display: none; }
.image-preview-wrap { display: inline-flex; align-items: center; justify-content: center; max-width: 100%; max-height: 280px; min-height: 36px; overflow: hidden; border-radius: var(--ui-radius-control); background: var(--ui-surface-muted); color: var(--ui-accent-strong); }
.image-preview-wrap img { display: block; max-width: 100%; max-height: 280px; width: auto; height: auto; object-fit: contain; border-radius: var(--ui-radius-control); }
.image-preview-wrap .lucide { width: 19px; height: 19px; margin: 9px; }
.row-main { min-width: 0; }
.preview { display: -webkit-box; max-height: 10.8em; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 8; color: var(--ui-text); font-size: 13px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
.note { display: flex; align-items: center; gap: 4px; margin-top: 5px; overflow: hidden; color: var(--ui-muted); font-size: 11px; white-space: nowrap; text-overflow: ellipsis; }
.note .lucide { flex: none; width: 13px; height: 13px; }
.meta { display: flex; gap: 8px; margin-top: 5px; overflow: hidden; color: var(--ui-subtle); font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
.row-side { display: flex; align-items: center; gap: 7px; color: var(--ui-subtle); font-size: 10px; }
.favorite-button { width: 25px; height: 25px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--ui-subtle); }
.favorite-button:hover { background: var(--ui-accent-quiet); }
.favorite-button .lucide { width: 15px; height: 15px; }
.favorite-button.active .lucide { fill: currentColor; }
.pin-badge { display: inline-flex; align-items: center; color: var(--ui-accent-strong); }
.pin-badge .lucide { width: 12px; height: 12px; }
.empty { padding: 56px 18px; color: var(--ui-muted); text-align: center; font-size: 13px; }
.footer { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 43px; padding: 7px 14px; border-top: 1px solid var(--ui-line); background: var(--ui-surface); color: var(--ui-muted); font-size: 11px; }
.footer-left { min-width: 0; display: flex; align-items: center; gap: 12px; }
.footer-right { flex: none; display: flex; align-items: center; gap: 6px; }
.pagination { display: flex; align-items: center; gap: 5px; }
.page-button { width: 26px; height: 27px; display: inline-grid; place-items: center; padding: 0; border: 1px solid var(--ui-line-strong); border-radius: 6px; background: var(--ui-surface); color: var(--ui-muted); }
.page-button:hover:not(:disabled) { background: var(--ui-accent-quiet); color: var(--ui-text); }
.page-button:disabled { opacity: .4; cursor: default; }
.page-label { min-width: 58px; text-align: center; font-size: 10px; }
.page-size { width: 70px; height: 27px; padding: 0 5px; border: 1px solid var(--ui-line-strong); border-radius: 6px; background: var(--ui-surface); color: var(--ui-muted); font-size: 10px; }
.selection-count { color: var(--ui-muted); font-size: 10px; white-space: nowrap; }
.footer-button { min-width: 50px; height: 29px; padding: 0 8px; border: 1px solid var(--ui-line-strong); border-radius: 7px; background: var(--ui-surface); color: var(--ui-text); font-size: 10px; white-space: nowrap; }
.footer-button:hover:not(:disabled) { background: var(--ui-accent-quiet); }
.footer-button.active { border-color: var(--ui-accent-strong); background: var(--ui-accent-soft); color: var(--ui-accent-strong); }
.footer-button.danger { color: var(--ui-danger); }
.footer-button:disabled { opacity: .45; cursor: default; }
.clear-button { min-width: 82px; height: 29px; padding: 0 11px; border: 1px solid var(--ui-danger); border-radius: 7px; background: var(--ui-danger-soft); color: var(--ui-danger); font-size: 11px; }
.clear-button:disabled { opacity: .45; cursor: default; }
#contextMenu { position: fixed; z-index: 20; min-width: 150px; padding: 5px; border: 1px solid var(--ui-line-strong); border-radius: 9px; background: var(--ui-surface-raised); box-shadow: var(--ui-shadow-soft); }
#contextMenu.hidden { display: none; }
.menu-item { width: 100%; min-height: 31px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ui-text); text-align: left; font-size: 12px; }
.menu-item:hover { background: var(--ui-accent-quiet); color: var(--ui-accent-strong); }
.menu-item.danger:hover { color: var(--ui-danger); background: var(--ui-danger-soft); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: var(--ui-radius-control); background: var(--ui-line-strong); background-clip: padding-box; }
</style>
</head>
<body>
<div class="app">
  <div class="windowbar" data-windowbar data-windowbar-title="capslock_p2 剪贴板历史" data-windowbar-icon="clipboard-list"></div>
  <div class="topbar">
    <label class="search"><i data-lucide="search"></i><input id="search" placeholder="搜索历史…" spellcheck="false" autocomplete="off"></label>
    <select id="dateFilter" class="date-filter" aria-label="日期筛选">
      <option value="all">全部日期</option>
      <option value="today">今天</option>
      <option value="3">近 3 天</option>
      <option value="7">近 7 天</option>
      <option value="30">近 30 天</option>
      <option id="selectedDateOption" value="custom-date" hidden></option>
      <option value="custom">选择日期…</option>
    </select>
  </div>
  <div class="filters" role="toolbar" aria-label="筛选">
    <button class="filter active" data-type="all"><i data-lucide="layers"></i><span>全部</span></button>
    <button class="filter" data-type="text"><i data-lucide="type"></i><span>文本</span></button>
    <button class="filter" data-type="image"><i data-lucide="image"></i><span>图片</span></button>
    <button class="filter" data-type="file"><i data-lucide="file"></i><span>文件</span></button>
    <button class="filter favorite" id="favoriteFilter"><i data-lucide="star"></i><span>收藏</span><span id="favoriteCount">0</span></button>
  </div>
  <main class="content"><div id="list" tabindex="0" role="listbox" aria-label="剪贴板历史列表"></div></main>
  <footer class="footer"><div class="footer-left"><span id="status">暂无历史</span><div class="pagination"><button class="page-button" id="prevPage" aria-label="上一页"><i data-lucide="chevron-left"></i></button><span class="page-label" id="pageLabel">第 1 / 1 页</span><button class="page-button" id="nextPage" aria-label="下一页"><i data-lucide="chevron-right"></i></button><select id="pageSize" class="page-size" aria-label="每页数量"><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select></div></div><div class="footer-right"><span id="selectionCount" class="selection-count" hidden></span><button class="footer-button" id="multiSelectButton">多选</button><button class="footer-button" id="bulkNoteButton" hidden disabled>添加备注</button><button class="footer-button danger" id="bulkDeleteButton" hidden disabled>删除</button><button class="clear-button" id="clearButton" disabled>清空</button></div></footer>
</div>
<div id="contextMenu" class="hidden" role="menu">
  <button class="menu-item" role="menuitem" data-action="copy"><i data-lucide="copy"></i><span>复制</span></button>
  <button class="menu-item" role="menuitem" data-action="paste"><i data-lucide="clipboard-paste"></i><span>粘贴</span></button>
  <button class="menu-item" role="menuitem" data-action="favorite"><i data-lucide="star"></i><span>收藏</span></button>
  <button class="menu-item" role="menuitem" data-action="note"><i data-lucide="message-square-plus"></i><span>添加备注</span></button>
  <button class="menu-item" role="menuitem" data-action="pin"><i data-lucide="pin"></i><span>置顶</span></button>
  <button class="menu-item danger" role="menuitem" data-action="delete"><i data-lucide="trash-2"></i><span>删除</span></button>
</div>
<script src="clipboard-history.js"></script>
</body>
</html>
