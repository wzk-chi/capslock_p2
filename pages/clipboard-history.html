<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>capslock_p2 剪贴板历史</title>
<link rel="stylesheet" href="theme.css">
<script src="toast.js"></script>
<script src="../vendor/lucide/lucide.min.js"></script>
<script src="icons.js"></script>
<script src="dialog.js"></script>
<script src="windowbar.js"></script>
<style>
:root { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--ui-bg); color: var(--ui-text); }
button, input { font: inherit; }
button { cursor: pointer; }
.app { height: 100%; display: flex; flex-direction: column; }
.topbar { flex: none; display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 52px; border-bottom: 1px solid var(--ui-line); background: var(--ui-surface); }
.title { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 15px; font-weight: 650; }
.title .lucide { width: 17px; height: 17px; color: var(--ui-accent-strong); }
.search { min-width: 160px; flex: 1; height: 33px; display: flex; align-items: center; gap: 7px; padding: 0 10px; border: 1px solid var(--ui-line-strong); border-radius: 8px; background: var(--ui-surface-soft); }
.search .lucide { width: 15px; height: 15px; color: var(--ui-muted); }
.search input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ui-text); font-size: 12px; }
.search input::placeholder { color: var(--ui-subtle); }
.filters { flex: none; display: flex; align-items: center; gap: 5px; padding: 9px 18px; border-bottom: 1px solid var(--ui-line); background: var(--ui-surface); overflow-x: auto; }
.filter { min-width: 54px; height: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 10px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--ui-muted); font-size: 11px; white-space: nowrap; }
.filter .lucide { width: 14px; height: 14px; }
.filter:hover { background: var(--ui-accent-quiet); color: var(--ui-text); }
.filter.active { border-color: var(--ui-line-strong); background: var(--ui-accent-soft); color: var(--ui-accent-strong); font-weight: 650; }
.filter.favorite { margin-left: 0; }
.content { min-height: 0; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
#list { min-height: 0; flex: 1; overflow-y: auto; padding: 7px 9px 12px; outline: none; }
.history-row { position: relative; display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 66px; max-height: 320px; overflow: hidden; padding: 9px 11px; border: 1px solid transparent; border-radius: 9px; cursor: pointer; }
.history-row:hover { background: var(--ui-accent-quiet); }
.history-row.selected { border-color: var(--ui-line-strong); background: var(--ui-accent-soft); }
.type-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; background: var(--ui-surface-muted); color: var(--ui-accent-strong); font-size: 19px; }
.image-preview-wrap { display: inline-flex; align-items: center; justify-content: center; max-width: 100%; max-height: 280px; min-height: 36px; overflow: hidden; border-radius: 8px; background: var(--ui-surface-muted); color: var(--ui-accent-strong); }
.image-preview-wrap img { display: block; max-width: 100%; max-height: 280px; width: auto; height: auto; object-fit: contain; border-radius: 8px; }
.image-preview-wrap .lucide { width: 19px; height: 19px; margin: 9px; }
.row-main { min-width: 0; }
.preview { overflow: hidden; color: var(--ui-text); font-size: 13px; line-height: 1.35; white-space: nowrap; text-overflow: ellipsis; }
.preview.rich::after { content: " · 富文本"; color: var(--ui-muted); font-size: 10px; }
.meta { display: flex; gap: 8px; margin-top: 5px; overflow: hidden; color: var(--ui-subtle); font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
.row-side { display: flex; align-items: center; gap: 7px; color: var(--ui-subtle); font-size: 10px; }
.favorite-button { width: 25px; height: 25px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--ui-subtle); }
.favorite-button:hover { background: var(--ui-accent-quiet); }
.favorite-button .lucide { width: 15px; height: 15px; }
.favorite-button.active .lucide { fill: currentColor; }
.empty { padding: 56px 18px; color: var(--ui-muted); text-align: center; font-size: 13px; }
.footer { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 43px; padding: 7px 14px; border-top: 1px solid var(--ui-line); background: var(--ui-surface); color: var(--ui-muted); font-size: 11px; }
.clear-button { min-width: 82px; height: 29px; padding: 0 11px; border: 1px solid var(--ui-danger); border-radius: 7px; background: var(--ui-danger-soft); color: var(--ui-danger); font-size: 11px; }
.clear-button:disabled { opacity: .45; cursor: default; }
#contextMenu { position: fixed; z-index: 20; min-width: 150px; padding: 5px; border: 1px solid var(--ui-line-strong); border-radius: 9px; background: var(--ui-surface-raised); box-shadow: var(--ui-shadow-soft); }
#contextMenu.hidden { display: none; }
.menu-item { width: 100%; min-height: 31px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ui-text); text-align: left; font-size: 12px; }
.menu-item:hover { background: var(--ui-accent-quiet); color: var(--ui-accent-strong); }
.menu-item.danger:hover { color: var(--ui-danger); background: var(--ui-danger-soft); }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 8px; background: var(--ui-line-strong); background-clip: padding-box; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title"><i data-lucide="clipboard-list"></i><span>剪贴板历史</span></div>
    <label class="search"><i data-lucide="search"></i><input id="search" placeholder="搜索历史…" spellcheck="false" autocomplete="off"></label>
  </div>
  <div class="filters" role="toolbar" aria-label="筛选">
    <button class="filter active" data-type="all"><i data-lucide="layers"></i><span>全部</span></button>
    <button class="filter" data-type="text"><i data-lucide="type"></i><span>文本</span></button>
    <button class="filter" data-type="image"><i data-lucide="image"></i><span>图片</span></button>
    <button class="filter" data-type="file"><i data-lucide="file"></i><span>文件</span></button>
    <button class="filter favorite" id="favoriteFilter"><i data-lucide="star"></i><span>收藏</span><span id="favoriteCount">0</span></button>
  </div>
  <main class="content"><div id="list" tabindex="0" role="listbox" aria-label="剪贴板历史列表"></div></main>
  <footer class="footer"><span id="status">暂无历史</span><button class="clear-button" id="clearButton" disabled>清空</button></footer>
</div>
<div id="contextMenu" class="hidden" role="menu">
  <button class="menu-item" data-action="copy"><i data-lucide="copy"></i><span>复制</span></button>
  <button class="menu-item" data-action="paste"><i data-lucide="clipboard-paste"></i><span>粘贴</span></button>
  <button class="menu-item" data-action="favorite"><i data-lucide="star"></i><span>收藏</span></button>
  <button class="menu-item danger" data-action="delete"><i data-lucide="trash-2"></i><span>删除</span></button>
</div>
<script>
WindowBar.init();
const list = document.getElementById('list');
const search = document.getElementById('search');
const status = document.getElementById('status');
const clearButton = document.getElementById('clearButton');
const favoriteFilter = document.getElementById('favoriteFilter');
const favoriteCount = document.getElementById('favoriteCount');
const contextMenu = document.getElementById('contextMenu');
const state = { sessionId: '', rows: [], type: 'all', favoriteOnly: false, search: '', counts: {}, nextCursor: 0, selectedId: '', contextId: '', querySerial: 0, queryTimer: 0, loading: false, composing: false, pendingFavorites: new Map(), imagePreviews: new Map(), imagePreviewOrder: [], imagePreviewRequested: new Set(), imageObserver: null };

function post(message) { if (window.chrome && chrome.webview) chrome.webview.postMessage(JSON.stringify(message)); }
function toast(text, type = 'info') { if (text) AppToast.show(text, type); }
function icon(node, name) { if (typeof createIcon === 'function') node.appendChild(createIcon(name)); else node.textContent = '•'; }
function typeIcon(type) { return type === 'image' ? 'image' : type === 'file' ? 'file' : type === 'rich' ? 'file-pen' : 'type'; }
function typeName(type) { return type === 'image' ? '图片' : type === 'file' ? '文件' : type === 'rich' ? '富文本' : '文本'; }
function timeText(value) { if (!value) return ''; const digits = String(value).replace(/\D/g, ''); if (digits.length < 14) return value; const date = new Date(Date.UTC(Number(digits.slice(0,4)), Number(digits.slice(4,6))-1, Number(digits.slice(6,8)), Number(digits.slice(8,10)), Number(digits.slice(10,12)), Number(digits.slice(12,14)))); const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000)); if (seconds < 60) return '刚刚'; if (seconds < 3600) return `${Math.floor(seconds / 60)} 分钟前`; if (seconds < 86400) return `${Math.floor(seconds / 3600)} 小时前`; return `${Math.floor(seconds / 86400)} 天前`; }
function sizeText(bytes) { if (!bytes) return ''; if (bytes < 1024) return `${bytes} B`; if (bytes < 1024*1024) return `${Math.round(bytes/1024)} KB`; return `${(bytes/1024/1024).toFixed(1)} MB`; }
function requestQuery(reset = true) { clearTimeout(state.queryTimer); if (reset) { state.rows = []; state.nextCursor = 0; state.selectedId = ''; state.loading = false; render(); } state.queryTimer = setTimeout(() => { state.querySerial += 1; post({ type:'query', sessionId:state.sessionId, queryId:state.querySerial, search:state.search, primaryType:state.type, favoriteOnly:state.favoriteOnly, cursor:state.nextCursor }); }, 160); }
function rowPreview(row) { if (row.type === 'file' && row.files && row.files.length) return row.files.length > 1 ? `${row.files[0]} 等 ${row.files.length} 项` : row.files[0]; return row.preview || typeName(row.type); }
function rowMeta(row) { if (row.type === 'image' && row.imageWidth && row.imageHeight) return `${row.imageWidth} × ${row.imageHeight}`; if (row.type === 'file') return `${row.itemCount || (row.files || []).length || 0} 项`; return row.byteSize ? sizeText(row.byteSize) : typeName(row.type); }
function requestImagePreview(id) { const key = String(id); if (state.imagePreviewRequested.has(key) || state.imagePreviews.has(key)) return; state.imagePreviewRequested.add(key); post({type:'imagePreview',sessionId:state.sessionId,id}); }
function observeImageThumb(node, id) { if (state.imagePreviews.has(String(id))) return; if (typeof IntersectionObserver === 'undefined') { requestImagePreview(id); return; } if (!state.imageObserver) state.imageObserver = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { state.imageObserver.unobserve(entry.target); requestImagePreview(entry.target.dataset.imageId); } }), {root:list, rootMargin:'120px'}); node.dataset.imageId = id; state.imageObserver.observe(node); }
function fillImagePreview(node, dataUri) { node.textContent = ''; if (dataUri) { const image = document.createElement('img'); image.src = dataUri; image.alt = '图片预览'; image.draggable = false; node.appendChild(image); } else { icon(node, 'image'); if (window.lucide) lucide.createIcons(); } }
function rememberImagePreview(key, dataUri) { state.imagePreviews.set(key, dataUri); state.imagePreviewOrder = state.imagePreviewOrder.filter(item => item !== key); if (dataUri) state.imagePreviewOrder.push(key); while (state.imagePreviewOrder.length > 48) { const oldest = state.imagePreviewOrder.shift(); state.imagePreviews.delete(oldest); } }
function applyImagePreview(id, dataUri) { const key = String(id); state.imagePreviewRequested.delete(key); const previewData = String(dataUri || ''); rememberImagePreview(key, previewData); const article = findRowElement(id); const preview = article ? article.querySelector('.image-preview-wrap') : 0; if (preview) fillImagePreview(preview, previewData); }
function updateSummary() { const total = Number(state.counts.total || 0), matching = Number(state.counts.matching ?? state.rows.length), nonFavorite = Number(state.counts.nonFavorite || 0); favoriteCount.textContent = String(state.counts.favorite || 0); status.textContent = state.counts.error ? '历史存储不可用' : `共 ${total} 条 · 当前 ${matching} 条`; clearButton.disabled = !!state.counts.error || nonFavorite <= 0; favoriteFilter.classList.toggle('active', state.favoriteOnly); }
function findRowElement(id) { return Array.from(list.querySelectorAll('.history-row')).find(item => item.dataset.id === String(id)); }
function selectRow(id) { const key = String(id); state.selectedId = id; list.querySelectorAll('.history-row').forEach(article => { const selected = article.dataset.id === key; article.classList.toggle('selected', selected); article.setAttribute('aria-selected', selected ? 'true' : 'false'); }); }
function updateFavoriteVisual(row) { const article = findRowElement(row.id); if (!article) return; const button = article.querySelector('.favorite-button'); if (!button) return; button.classList.toggle('active', !!row.favorite); button.title = row.favorite ? '取消收藏' : '收藏'; button.setAttribute('aria-label', button.title); }
function appendEmptyState() { const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = state.search || state.favoriteOnly || state.type !== 'all' ? '没有匹配的历史' : '暂无剪贴板历史'; list.appendChild(empty); }
function applyFavoriteResult(id, desired) { const rowId = String(id || ''); state.pendingFavorites.delete(rowId); const index = state.rows.findIndex(item => String(item.id) === rowId); if (index < 0) return; const row = state.rows[index], previous = !!row.favorite, next = !!desired; if (previous === next) { updateFavoriteVisual(row); return; } row.favorite = next; state.counts.favorite = Math.max(0, Number(state.counts.favorite || 0) + (next ? 1 : -1)); state.counts.nonFavorite = Math.max(0, Number(state.counts.nonFavorite || 0) + (next ? -1 : 1)); if (state.favoriteOnly && !next) { const matching = Number(state.counts.matching ?? state.rows.length); state.counts.matching = Math.max(0, matching - 1); const article = findRowElement(row.id); if (article) article.remove(); state.rows.splice(index, 1); if (state.selectedId === row.id) state.selectedId = ''; if (!state.rows.length) appendEmptyState(); } else updateFavoriteVisual(row); updateSummary(); }
function toggleFavorite(row) { const rowId = String(row.id); if (state.pendingFavorites.has(rowId)) return; const desired = !row.favorite; state.pendingFavorites.set(rowId, desired); post({type:'favorite',sessionId:state.sessionId,id:row.id,desired}); }
function render() { if (state.imageObserver) state.imageObserver.disconnect(); list.textContent = ''; const storageError = String(state.counts.error || ''); if (storageError) { const error = document.createElement('div'); error.className = 'empty'; error.textContent = `剪贴板历史不可用：${storageError}`; list.appendChild(error); } else if (!state.rows.length) { const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = state.search || state.favoriteOnly || state.type !== 'all' ? '没有匹配的历史' : '暂无剪贴板历史'; list.appendChild(empty); } else { state.rows.forEach(row => renderRow(row)); } const total = Number(state.counts.total || 0), matching = Number(state.counts.matching ?? state.rows.length), nonFavorite = Number(state.counts.nonFavorite || 0); favoriteCount.textContent = String(state.counts.favorite || 0); status.textContent = storageError ? '历史存储不可用' : `共 ${total} 条 · 当前 ${matching} 条`; clearButton.disabled = !!storageError || nonFavorite <= 0; favoriteFilter.classList.toggle('active', state.favoriteOnly); if (window.lucide) lucide.createIcons(); }
function renderRow(row) { const article = document.createElement('article'); article.className = 'history-row' + (row.id === state.selectedId ? ' selected' : ''); article.dataset.id = row.id; article.setAttribute('role','option'); article.setAttribute('aria-selected', row.id === state.selectedId ? 'true' : 'false'); const glyph = document.createElement('div'); glyph.className='type-icon'; icon(glyph,typeIcon(row.type)); const main=document.createElement('div'); main.className='row-main'; const imageKey = String(row.id); const cachedImagePreview = state.imagePreviews.get(imageKey); let preview = 0; if (row.type === 'image') { preview=document.createElement('div'); preview.className='image-preview-wrap'; fillImagePreview(preview, cachedImagePreview || ''); } else { preview=document.createElement('div'); preview.className='preview' + (row.richText ? ' rich' : ''); preview.textContent=rowPreview(row); } const meta=document.createElement('div'); meta.className='meta'; meta.textContent=`${timeText(row.capturedAt)} · ${typeName(row.type)} · ${rowMeta(row)}`; main.append(preview,meta); const side=document.createElement('div'); side.className='row-side'; const fav=document.createElement('button'); fav.className='favorite-button'+(row.favorite?' active':''); fav.title=row.favorite?'取消收藏':'收藏'; fav.setAttribute('aria-label',fav.title); fav.dataset.action='favorite'; icon(fav,'star'); fav.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();toggleFavorite(row);}); side.append(fav); article.append(glyph,main,side); article.addEventListener('click',event=>{ if(event.detail===1){ selectRow(row.id); post({type:'copy',sessionId:state.sessionId,id:row.id}); } }); article.addEventListener('dblclick',event=>{ event.preventDefault(); selectRow(row.id); post({type:'paste',sessionId:state.sessionId,id:row.id}); }); article.addEventListener('contextmenu',event=>{event.preventDefault();state.contextId=row.id;selectRow(row.id);showMenu(event.clientX,event.clientY,row);}); list.appendChild(article); if (row.type === 'image' && !state.imagePreviews.has(imageKey)) observeImageThumb(preview,row.id); }
function showMenu(x,y,row){ contextMenu.classList.remove('hidden'); const favoriteItem=contextMenu.querySelector('[data-action="favorite"] span'); favoriteItem.textContent=row.favorite?'取消收藏':'收藏'; const left=Math.min(x,window.innerWidth-contextMenu.offsetWidth-8),top=Math.min(y,window.innerHeight-contextMenu.offsetHeight-8); contextMenu.style.left=Math.max(8,left)+'px';contextMenu.style.top=Math.max(8,top)+'px'; if(window.lucide)lucide.createIcons(); }
function hideMenu(){contextMenu.classList.add('hidden');state.contextId='';}
async function contextAction(action){ const id=state.contextId; const row=state.rows.find(item=>item.id===id); hideMenu(); if(!id||!row)return; if(action==='copy')post({type:'copy',sessionId:state.sessionId,id}); else if(action==='paste')post({type:'paste',sessionId:state.sessionId,id}); else if(action==='favorite')toggleFavorite(row); else if(action==='delete'){ const confirmed=!row.favorite||await AppDialog.confirm({title:'删除收藏历史',message:'删除后会同时移除收藏，确定继续吗？',confirmText:'删除',tone:'danger'}); if(confirmed)post({type:'delete',sessionId:state.sessionId,id}); } }
contextMenu.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button)contextAction(button.dataset.action);});
document.addEventListener('click',event=>{if(!contextMenu.contains(event.target))hideMenu();});
search.addEventListener('compositionstart',()=>{state.composing=true;});
search.addEventListener('compositionend',()=>{state.composing=false;state.search=search.value;requestQuery(true);});
search.addEventListener('input',()=>{state.search=search.value;if(!state.composing)requestQuery(true);});
document.querySelectorAll('.filter[data-type]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.filter[data-type]').forEach(item=>item.classList.remove('active'));button.classList.add('active');state.type=button.dataset.type;requestQuery(true);}));
favoriteFilter.addEventListener('click',()=>{state.favoriteOnly=!state.favoriteOnly;requestQuery(true);});
list.addEventListener('scroll',()=>{if(list.scrollTop+list.clientHeight>=list.scrollHeight-40&&state.nextCursor&&!state.loading){state.loading=true;post({type:'query',sessionId:state.sessionId,queryId:++state.querySerial,search:state.search,primaryType:state.type,favoriteOnly:state.favoriteOnly,cursor:state.nextCursor});}});
clearButton.addEventListener('click',()=>{post({type:'prepareClear',sessionId:state.sessionId});});
window.handleHostMessage=function(message){ const data=message||{}; if(data.type==='hostState'){ state.sessionId=String(data.sessionId||''); state.search=String(data.search||''); search.value=state.search; state.type=String(data.primaryType||'all'); state.favoriteOnly=!!data.favoriteOnly; document.querySelectorAll('.filter[data-type]').forEach(item=>item.classList.toggle('active',item.dataset.type===state.type)); requestQuery(true); } else if(data.type==='historyResults'){ if(data.sessionId!==state.sessionId)return; const responseQueryId=Number(data.queryId||0); if(responseQueryId && responseQueryId!==state.querySerial)return; if(!data.append)state.rows=[]; state.rows=state.rows.concat(Array.isArray(data.rows)?data.rows:[]); state.counts=data.counts||{};state.nextCursor=Number(data.nextCursor||0);state.loading=false;render(); } else if(data.type==='imagePreview'){ if(data.sessionId!==state.sessionId)return; applyImagePreview(data.id,data.data); } else if(data.type==='clearInfo'){ AppDialog.confirm({title:'清空未收藏的剪贴板历史？',message:`将清空全部未收藏历史，当前共 ${data.nonFavoriteCount||0} 条；${data.favoriteCount||0} 条收藏会保留。`,confirmText:'清空未收藏',tone:'danger'}).then(ok=>post({type:ok?'clear':'cancelClear',sessionId:state.sessionId,token:data.token})); } else if(data.type==='actionResult'){ if(data.ok)toast(data.message||'已完成','success'); else toast(data.message||'操作失败','error'); if(data.action==='favorite'){ if(data.ok)applyFavoriteResult(data.id,data.desired); else state.pendingFavorites.delete(String(data.id||'')); } else if(data.action==='delete'||data.action==='clear')requestQuery(true); } };
window.setState=function(payload){ if(payload&&payload.sessionId)state.sessionId=payload.sessionId; if(payload&&payload.search!=null){state.search=payload.search;search.value=state.search;} requestQuery(true); };
setTimeout(()=>post({type:'ready',sessionId:state.sessionId}),0);
if(window.lucide)lucide.createIcons();
</script>
</body>
</html>
