<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>capslock_p2 Translate</title>
<style>
:root { color-scheme: light dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ui-surface); color: var(--ui-text); }
main { height: 100vh; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.toolbar { display: flex; align-items: center; gap: 8px; flex: none; min-height: 32px; }
.toolbar-spacer { flex: 1; min-width: 8px; }
.toolbar-actions { display: flex; align-items: center; gap: 7px; }
.language-bar { display: flex; align-items: end; justify-content: center; gap: 10px; align-self: center; width: min(620px, 100%); flex: none; padding: 2px 8px; }
.language-field { display: grid; gap: 4px; min-width: 0; flex: 1 1 220px; max-width: 260px; }
.language-field span { color: var(--ui-muted); font-size: 11px; }
.language-field select { width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--ui-line-strong); border-radius: 7px; background: var(--ui-surface); color: var(--ui-text); }
.language-field select:focus { border-color: var(--ui-accent); outline: none; box-shadow: 0 0 0 3px var(--ui-ring); }
#swapLanguages { flex: none; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--ui-accent); font-size: 20px; line-height: 1; }
#swapLanguages:hover { background: transparent; color: var(--ui-accent-strong); }
#swapLanguages:disabled { border: 0; background: transparent; color: var(--ui-subtle); }
.columns { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.pane-head { display: flex; align-items: center; gap: 8px; flex: none; }
.pane-head label { flex: 1; min-width: 0; font-size: 12px; font-weight: 650; color: var(--ui-text); }
#status { flex: 1; min-width: 0; color: var(--ui-muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status.error { color: var(--ui-danger); }
textarea { width: 100%; flex: 1; min-height: 0; padding: 11px 12px; border: 1px solid var(--ui-line-strong); border-radius: 9px; background: var(--ui-surface-soft); color: var(--ui-text); font: 14px/1.6 Consolas, "Microsoft YaHei", monospace; outline: none; resize: none; }
textarea:focus { border-color: var(--ui-accent); background: var(--ui-surface); box-shadow: 0 0 0 3px var(--ui-ring); }
#result { background: var(--ui-surface-soft); }
button { border: 0; border-radius: 8px; padding: 8px 16px; background: var(--ui-button-bg); color: var(--ui-button-text); cursor: pointer; font-weight: 600; }
button:hover { background: var(--ui-button-hover); }
button:disabled { background: var(--ui-surface-muted); color: var(--ui-subtle); cursor: default; }
button.secondary { background: transparent; color: var(--ui-accent); border: 1px solid var(--ui-line-strong); font-weight: 500; }
button.secondary:hover { background: var(--ui-accent-soft); }
button.secondary:disabled { color: var(--ui-subtle); border-color: var(--ui-line); background: transparent; }
button.small { min-height: 28px; padding: 3px 10px; font-size: 11px; border-radius: 7px; }
button#pinPanel.pinned { background: var(--ui-accent-soft); color: var(--ui-accent-strong); border-color: var(--ui-accent); }
button#pinPanel.pinned:hover { background: var(--ui-accent-quiet); }
button.copied { color: var(--ui-success); border-color: var(--ui-success); }
button.copied:hover { background: var(--ui-success-soft); }
@media (max-width: 720px) {
  .toolbar { align-items: stretch; flex-wrap: wrap; }
  #status { flex: 1 1 100%; order: 2; }
  .toolbar-actions { margin-left: auto; }
  .columns { grid-template-columns: 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); }
}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<main id="mainView">
  <div class="toolbar">
    <span id="status"></span>
    <div class="toolbar-actions">
      <button id="pinPanel" class="secondary small" data-i18n="pin" aria-pressed="false">Pin</button>
      <button id="openDictionary" class="secondary small" data-i18n="dictionary">Dictionary</button>
      <button id="openSettings" class="secondary small" data-i18n="settings">Settings</button>
      <button id="translate" data-i18n="translate" title="Ctrl + Enter">Translate</button>
    </div>
  </div>
  <div id="languageBar" class="language-bar" hidden>
    <label id="sourceLanguageField" class="language-field">
      <select id="sourceLanguage" aria-label="Source language"></select>
    </label>
    <button id="swapLanguages" class="small" title="Swap languages" aria-label="Swap languages">⇄</button>
    <label class="language-field">
      <select id="targetLanguage" aria-label="Target language"></select>
    </label>
  </div>
  <div class="columns">
    <section class="pane">
      <div class="pane-head">
        <label for="source" data-i18n="source">Source</label>
        <button id="convertIdentifier" class="secondary small" data-i18n="identifierConvert" disabled>Convert identifier</button>
        <button id="copySource" class="secondary small" data-i18n="copySource" disabled>Copy source</button>
      </div>
      <textarea id="source" spellcheck="false" autofocus></textarea>
    </section>
    <section class="pane">
      <div class="pane-head">
        <label for="result" data-i18n="translation">Translation</label>
        <button id="copyResult" class="secondary small" data-i18n="copyResult" disabled>Copy translation</button>
      </div>
      <textarea id="result" readonly spellcheck="false"></textarea>
    </section>
  </div>
</main>

<script>
const source = document.getElementById('source');
const result = document.getElementById('result');
const status = document.getElementById('status');
const translateBtn = document.getElementById('translate');
const pinBtn = document.getElementById('pinPanel');
const settingsBtn = document.getElementById('openSettings');
const dictionaryBtn = document.getElementById('openDictionary');
const copySourceBtn = document.getElementById('copySource');
const copyResultBtn = document.getElementById('copyResult');
const identifierConvertBtn = document.getElementById('convertIdentifier');
const languageBar = document.getElementById('languageBar');
const sourceLanguageField = document.getElementById('sourceLanguageField');
const sourceLanguageSelect = document.getElementById('sourceLanguage');
const targetLanguageSelect = document.getElementById('targetLanguage');
const swapLanguagesBtn = document.getElementById('swapLanguages');

// The panel is bilingual: the UI follows the configured target language
// (Chinese target → Chinese UI, anything else → English). AHK decides and
// sends uiLanguage with the settings.
const STRINGS = {
  en: {
    appTitle: 'capslock_p2 Translate',
    source: 'Source',
    translation: 'Translation',
    sourceLanguage: 'Source language',
    targetLanguage: 'Target language',
    swap: 'Swap',
    chooseDirection: 'Choose the source and target languages',
    pin: 'Pin',
    unpin: 'Unpin',
    settings: 'Settings',
    dictionary: 'Dictionary',
    translate: 'Translate',
    identifierConvert: 'Convert identifier',
    copySource: 'Copy source',
    copyResult: 'Copy translation',
    copied: 'Copied',
    copyFailed: 'Copy failed',
    ready: 'Ready',
    translating: 'Translating…',
    done: 'Done',
    failed: 'Translation failed'
  },
  zh: {
    appTitle: 'capslock_p2 翻译',
    source: '原文',
    translation: '译文',
    sourceLanguage: '原语言',
    targetLanguage: '目标语言',
    swap: '交换',
    chooseDirection: '请选择原语言和目标语言',
    pin: '固定',
    unpin: '取消固定',
    settings: '设置',
    dictionary: '词典',
    translate: '翻译',
    identifierConvert: '标识符转换',
    copySource: '复制原文',
    copyResult: '复制译文',
    copied: '已复制',
    copyFailed: '复制失败',
    ready: '就绪',
    translating: '翻译中…',
    done: '完成',
    failed: '翻译失败'
  }
};

let lang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
let pinned = false;
let translationSettings = { mode: 'fixed', languageA: 'zh-CN', languageB: 'en', targetLanguage: 'system' };
let directionManual = false;
let directionReady = true;

const LANGUAGE_LABELS = {
  'zh-CN': ['简体中文', 'Simplified Chinese'], 'zh-TW': ['繁體中文', 'Traditional Chinese'],
  en: ['English', 'English'], ja: ['日本語', 'Japanese'], ko: ['한국어', 'Korean'],
  fr: ['Français', 'French'], de: ['Deutsch', 'German'], es: ['Español', 'Spanish'],
  ru: ['Русский', 'Russian'], it: ['Italiano', 'Italian'], pt: ['Português', 'Portuguese'],
  ar: ['العربية', 'Arabic'], system: ['系统语言', 'System language']
};
const LANGUAGE_CODES = ['zh-CN', 'zh-TW', 'en', 'ja', 'ko', 'fr', 'de', 'es', 'ru', 'it', 'pt', 'ar'];

function t(key) {
  return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
}

function applyLanguage() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t('appTitle');
  for (const node of document.querySelectorAll('[data-i18n]'))
    node.textContent = t(node.dataset.i18n);
  // A copy button mid-flash keeps its feedback label under the new language.
  for (const btn of [copySourceBtn, copyResultBtn])
    if (btn.dataset.flash)
      btn.textContent = t(btn.dataset.flash);
  sourceLanguageSelect.setAttribute('aria-label', t('sourceLanguage'));
  targetLanguageSelect.setAttribute('aria-label', t('targetLanguage'));
  swapLanguagesBtn.title = t('swap');
  swapLanguagesBtn.setAttribute('aria-label', t('swap'));
  identifierConvertBtn.title = t('identifierConvert');
  if (!translateBtn.disabled && ['', 'ready', 'done'].includes(status.dataset.state))
    status.textContent = status.dataset.state === 'done' ? t('done') : t('ready');
  applyPinnedState(pinned);
  refreshLanguageOptionLabels();
}

function languageLabel(code) {
  const labels = LANGUAGE_LABELS[code];
  return labels ? labels[lang === 'zh' ? 0 : 1] : code;
}

function refreshLanguageOptionLabels() {
  for (const select of [sourceLanguageSelect, targetLanguageSelect]) {
    for (const option of select.options)
      option.textContent = languageLabel(option.value);
  }
}

function fillLanguageSelect(select, codes, includeSystem = false) {
  const values = includeSystem ? ['system', ...codes] : codes;
  const previous = select.value;
  select.replaceChildren();
  for (const code of values) {
    const option = document.createElement('option');
    option.value = code;
    option.textContent = languageLabel(code);
    select.appendChild(option);
  }
  if (values.includes(previous)) select.value = previous;
}

function applyTranslationSettings(settings) {
  const next = settings && typeof settings === 'object' ? settings : {};
  translationSettings = {
    mode: next.mode === 'bidirectional' ? 'bidirectional' : 'fixed',
    languageA: LANGUAGE_CODES.includes(next.languageA) ? next.languageA : 'zh-CN',
    languageB: LANGUAGE_CODES.includes(next.languageB) ? next.languageB : 'en',
    targetLanguage: ['system', ...LANGUAGE_CODES].includes(next.targetLanguage) ? next.targetLanguage : 'system'
  };
  languageBar.hidden = false;
  if (translationSettings.mode === 'bidirectional') {
    const pair = [translationSettings.languageA, translationSettings.languageB];
    fillLanguageSelect(sourceLanguageSelect, pair);
    fillLanguageSelect(targetLanguageSelect, pair);
    if (!pair.includes(sourceLanguageSelect.value)) sourceLanguageSelect.value = pair[0];
    if (!pair.includes(targetLanguageSelect.value) || sourceLanguageSelect.value === targetLanguageSelect.value)
      targetLanguageSelect.value = pair[1];
    sourceLanguageField.hidden = false;
    swapLanguagesBtn.hidden = false;
    targetLanguageSelect.disabled = false;
    swapLanguagesBtn.disabled = false;
    directionManual = false;
    directionReady = false;
  } else {
    fillLanguageSelect(targetLanguageSelect, LANGUAGE_CODES, true);
    targetLanguageSelect.value = translationSettings.targetLanguage;
    sourceLanguageField.hidden = true;
    swapLanguagesBtn.hidden = true;
    targetLanguageSelect.disabled = true;
    directionManual = false;
    directionReady = true;
  }
  refreshLanguageOptionLabels();
}

function applyPinnedState(value) {
  pinned = !!value;
  const key = pinned ? 'unpin' : 'pin';
  pinBtn.dataset.i18n = key;
  pinBtn.textContent = t(key);
  pinBtn.title = t(key);
  pinBtn.setAttribute('aria-pressed', pinned ? 'true' : 'false');
  pinBtn.classList.toggle('pinned', pinned);
}

function setStatus(key, state) {
  status.textContent = t(key);
  status.dataset.state = state || '';
  status.classList.toggle('error', state === 'error' || state === 'needs-direction');
}

function post(obj) {
  if (window.chrome && chrome.webview)
    chrome.webview.postMessage(JSON.stringify(obj));
}

function postType(type, text = '') {
  post({ type, text });
}

// Windows hides the pointer while typing when that system option is enabled.
// Native edit controls show it again on mouse movement; report that movement
// so the WebView2 host can restore the same behavior without polling.
let cursorMovePostedAt = 0;
document.addEventListener('mousemove', () => {
  const now = performance.now();
  if (now - cursorMovePostedAt < 80) return;
  cursorMovePostedAt = now;
  postType('cursorMove');
}, { passive: true });

function updateCopyButtons() {
  copySourceBtn.disabled = !source.value.trim();
  copyResultBtn.disabled = !result.value.trim();
  identifierConvertBtn.disabled = !source.value.trim();
}

async function writeClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // The async API can be unavailable or denied; fall back to the legacy
    // execCommand path with a throwaway selection.
    const helper = document.createElement('textarea');
    helper.value = text;
    helper.setAttribute('readonly', '');
    helper.style.position = 'fixed';
    helper.style.opacity = '0';
    document.body.appendChild(helper);
    helper.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    helper.remove();
    return ok;
  }
}

function flashCopyButton(button, ok) {
  const key = ok ? 'copied' : 'copyFailed';
  button.dataset.flash = key;
  button.textContent = t(key);
  button.classList.toggle('copied', ok);
  clearTimeout(button._flashTimer);
  button._flashTimer = setTimeout(() => {
    delete button.dataset.flash;
    button.classList.remove('copied');
    button.textContent = t(button.dataset.i18n);
  }, 1200);
}

async function copyFrom(textarea, button) {
  if (!textarea.value.trim()) return;
  flashCopyButton(button, await writeClipboard(textarea.value));
}

function identifierTokenToWords(token) {
  return token
    .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
    .replace(/([a-z\d])([A-Z])/g, '$1 $2')
    .replace(/([A-Za-z])(\d)/g, '$1 $2')
    .replace(/(\d)([A-Za-z])/g, '$1 $2')
    .replace(/[_\-.]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}

function convertIdentifierText(text) {
  const identifierPattern = /\b(?:[A-Za-z][A-Za-z0-9]*(?:[_\-.]+[A-Za-z0-9]+)+|[A-Za-z][A-Za-z0-9]*[A-Z][A-Za-z0-9]*|[A-Z]{2,})\b/g;
  return text.replace(identifierPattern, identifierTokenToWords);
}

function convertSourceIdentifiers() {
  const text = source.value;
  if (!text.trim()) return;
  const converted = convertIdentifierText(text);
  if (converted === text) return;
  source.value = converted;
  source.dispatchEvent(new Event('input', { bubbles: true }));
  source.focus();
  source.select();
}

copySourceBtn.addEventListener('click', () => copyFrom(source, copySourceBtn));
copyResultBtn.addEventListener('click', () => copyFrom(result, copyResultBtn));
identifierConvertBtn.addEventListener('click', convertSourceIdentifiers);
source.addEventListener('input', updateCopyButtons);
result.addEventListener('input', updateCopyButtons);

window.setSource = function (text) {
  source.value = text || '';
  result.value = '';
  directionManual = false;
  if (translationSettings.mode === 'bidirectional') {
    sourceLanguageSelect.value = translationSettings.languageA;
    targetLanguageSelect.value = translationSettings.languageB;
  }
  directionReady = translationSettings.mode === 'fixed';
  source.disabled = false;
  sourceLanguageSelect.disabled = false;
  targetLanguageSelect.disabled = translationSettings.mode === 'fixed';
  swapLanguagesBtn.disabled = translationSettings.mode !== 'bidirectional';
  translateBtn.disabled = false;
  updateCopyButtons();
  setStatus('ready');
  source.focus();
  source.select();
};

window.startTranslate = function () {
  const text = source.value.trim();
  if (!text) return;
  post({
    type: 'translate',
    text,
    sourceLanguage: translationSettings.mode === 'bidirectional' ? sourceLanguageSelect.value : '',
    targetLanguage: targetLanguageSelect.value,
    directionManual: translationSettings.mode === 'bidirectional' ? directionManual : false
  });
};

window.startStreaming = function () {
  result.value = '';
  source.disabled = true;
  sourceLanguageSelect.disabled = true;
  targetLanguageSelect.disabled = true;
  swapLanguagesBtn.disabled = true;
  translateBtn.disabled = true;
  updateCopyButtons();
  setStatus('translating', 'loading');
};

window.appendStreaming = function (text) {
  result.value += text || '';
  result.scrollTop = result.scrollHeight;
  updateCopyButtons();
};

window.setLoading = function (loading) {
  source.disabled = !!loading;
  sourceLanguageSelect.disabled = !!loading;
  targetLanguageSelect.disabled = !!loading || translationSettings.mode === 'fixed';
  swapLanguagesBtn.disabled = !!loading || translationSettings.mode !== 'bidirectional';
  translateBtn.disabled = !!loading;
  if (loading)
    setStatus('translating', 'loading');
  else if (status.dataset.state === 'loading')
    setStatus('ready');
};

window.setResult = function (text) {
  result.value = text || '';
  updateCopyButtons();
  setStatus('done', 'done');
  source.disabled = false;
  sourceLanguageSelect.disabled = false;
  targetLanguageSelect.disabled = translationSettings.mode === 'fixed';
  swapLanguagesBtn.disabled = translationSettings.mode !== 'bidirectional';
  translateBtn.disabled = false;
  result.focus();
};

window.setError = function (text) {
  result.value = '';
  updateCopyButtons();
  status.textContent = text || t('failed');
  status.dataset.state = 'error';
  status.classList.add('error');
  source.disabled = false;
  sourceLanguageSelect.disabled = false;
  targetLanguageSelect.disabled = translationSettings.mode === 'fixed';
  swapLanguagesBtn.disabled = translationSettings.mode !== 'bidirectional';
  translateBtn.disabled = false;
};

window.setNeedsDirection = function (text) {
  directionReady = false;
  directionManual = false;
  source.disabled = false;
  sourceLanguageSelect.disabled = false;
  targetLanguageSelect.disabled = translationSettings.mode === 'fixed';
  swapLanguagesBtn.disabled = translationSettings.mode !== 'bidirectional';
  translateBtn.disabled = false;
  status.textContent = text || t('chooseDirection');
  status.dataset.state = 'needs-direction';
  status.classList.add('error');
};

window.setDirection = function (sourceLanguage, targetLanguage, manual) {
  if (translationSettings.mode !== 'bidirectional') return;
  const pair = [translationSettings.languageA, translationSettings.languageB];
  if (!pair.includes(sourceLanguage) || !pair.includes(targetLanguage) || sourceLanguage === targetLanguage)
    return;
  sourceLanguageSelect.value = sourceLanguage;
  targetLanguageSelect.value = targetLanguage;
  directionManual = !!manual;
  directionReady = true;
  if (status.dataset.state === 'needs-direction')
    setStatus('ready');
};

// The standalone settings center pushes the interface language through the
// host snapshot; this hook keeps the translation panel language in step.
window.onHostSettings = function (s) {
  lang = s && s.uiLanguage === 'zh' ? 'zh' : 'en';
  applyTranslationSettings(s && s.translation);
  applyLanguage();
};

window.setPinned = function (value) {
  applyPinnedState(value);
};

translateBtn.addEventListener('click', window.startTranslate);
source.addEventListener('keydown', event => {
  if (event.key !== 'Enter' || event.isComposing) return;
  if (event.shiftKey) return;
  event.preventDefault();
  window.startTranslate();
});
source.addEventListener('input', () => {
  if (translationSettings.mode === 'bidirectional') {
    directionManual = false;
    directionReady = false;
  }
});
sourceLanguageSelect.addEventListener('change', () => {
  if (translationSettings.mode !== 'bidirectional') return;
  directionManual = true;
  directionReady = sourceLanguageSelect.value !== targetLanguageSelect.value;
  if (directionReady) setStatus('ready');
});
targetLanguageSelect.addEventListener('change', () => {
  if (translationSettings.mode !== 'bidirectional') return;
  directionManual = true;
  directionReady = sourceLanguageSelect.value !== targetLanguageSelect.value;
  if (directionReady) setStatus('ready');
});
swapLanguagesBtn.addEventListener('click', () => {
  if (translationSettings.mode !== 'bidirectional') return;
  const sourceValue = sourceLanguageSelect.value;
  sourceLanguageSelect.value = targetLanguageSelect.value;
  targetLanguageSelect.value = sourceValue;
  directionManual = true;
  directionReady = sourceLanguageSelect.value !== targetLanguageSelect.value;
  if (directionReady) setStatus('ready');
});

// Let the first Esc leave an editor, then use the next Esc to close the panel.
document.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  const active = document.activeElement;
  if (active && (active.matches('input, textarea, select') || active.isContentEditable)) {
    event.preventDefault();
    active.blur();
    return;
  }
  event.preventDefault();
  postType('hide');
});

settingsBtn.addEventListener('click', () => {
  postType('openSettings');
});

dictionaryBtn.addEventListener('click', () => postType('openDictionary', source.value));
pinBtn.addEventListener('click', () => postType('togglePinned'));

applyTranslationSettings(translationSettings);
applyLanguage();
setStatus('ready');
</script>
</body>
</html>
