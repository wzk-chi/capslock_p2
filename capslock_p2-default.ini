[Qbar]
; Everything 独立搜索页的查询配置。CapsLock+Q 中输入 e、everything、find 或 f 打开页面。
; es.exe、内置 Everything 和实例名由程序资源策略管理。
; 输入「cl set」打开设置中心；输入「ai」/「q」打开空白 AI 面板，追加问题可直接提问。
esMaxResults=50

[CustomHotkey]
; 全局自定义快捷键：可将触发键映射为发送按键、自带功能、保留应用原键或禁用。
; 设置页可以直接录制按键；按住 CapsLock 时让位给 CapsLock 层。
