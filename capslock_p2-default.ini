; capslock_p2 canonical default configuration
; -----------------------------------------------------------------------------
; This file is loaded first. The user's capslock_p2.ini is loaded afterwards
; and overrides only the values it contains. Keep this file free of personal
; API addresses, keys, paths and window bindings.
;
; capslock_p2-settingsDemo.ini is the explanatory reference with examples.
; It is never loaded automatically. The user file may contain only overrides;
; missing values continue to come from this file.

[Global]
; 开机启动：1 开启，0 关闭。
autostart=0
; 调试日志：1 开启，0 关闭；日志不会记录剪贴板内容和 API Key。
debug=0
; CapsLock+LAlt+鼠标滚轮使用的默认鼠标速度，范围 1~20。
mouseSpeed=3
; 独立剪贴板：1 开启，0 关闭。
allowClipboard=1
; 启动动画：1 开启，0 关闭。
loadingAnimation=1
; WebView2 面板隐藏后自动释放页面的等待分钟数；0 关闭，范围 0~1440。
webViewDestroyMinutes=30
; 界面语言：0 跟随系统，1 简体中文，2 English。
language=1
; 以管理员身份运行：1 开启，0 关闭；修改后重启程序生效。
runAsAdmin=1
; 首次安装使用介绍页是否已经打开；由程序维护，不显示在设置页。
usageShown=0

[LLM]
; 翻译与 AI 问答共用的 OpenAI 兼容 chat completions 配置。
endpoint=
apiKey=
apiKeyHeader=Authorization
apiKeyPrefix=Bearer
model=deepseek-flash
; 0=关闭思考参数，1=使用模型默认思考行为。
thinking=0
temperature=0.2
timeout=30000
; 翻译与 AI 问答共用的最大输入 token 估算上限。
maxInputTokens=200000

[LLMTranslate]
; LLM 翻译专用系统提示词模板；{{targetLanguage}} 会替换为目标语言。
systemPrompt=You are a precise translation engine. Translate the user's message into {{targetLanguage}}. Preserve meaning, tone, formatting, names and code. Keep the source text's line breaks and paragraph structure. Return only the translation, nothing else.

[TTranslate]
; 所有翻译引擎共用的配置。fixed 只使用 targetLanguage；bidirectional 使用 languageA/languageB。
mode=fixed
languageA=zh-CN
languageB=en
; fixed 模式下 system 跟随 Windows 系统语言，也可填 zh-CN / zh-TW / en / ja / ko 等代码。
targetLanguage=system
; auto 优先使用 LLM，再按已配置的其他引擎回退；也可指定 llm / youdao / volcengine。
engine=auto

[TYoudao]
; 有道智云翻译 API 凭据。目标语言使用上面的 [TTranslate] 设置。
appPaidID=
appPaidKey=

[TVolcengine]
; 火山引擎机器翻译 API 凭据。目标语言使用上面的 [TTranslate] 设置。
accessKey=
secretKey=
region=cn-north-1

[QAI]
; AI 问答只保存专用系统提示词，API 与模型参数使用 [LLM]。
systemPrompt=You are the assistant built into the capslock_p2 launcher. The user's message is either a question to answer or a text to explain; decide which one it is. If it is a question, answer it directly and completely. If it is a text (a word, sentence, paragraph, error message, log entry, code snippet or URL), explain what it means. Reply in the language of the user's message; if the message is not in Chinese or English, reply in {{uiLanguage}}. Be concise.

[TabHotString]
; CapsLock+Tab 会将光标左侧匹配到的键替换为对应值。
; 本段值支持「\n」换行和「\\」反斜杠转义。
; 留空表示使用内置行为，不创建示例条目。

[Keys]
; 按键函数值必须以 keyFunc_ 开头。用户只需在 capslock_p2.ini 中覆盖需要修改的键。
; 短按 CapsLock：切换大小写；按住 CapsLock 进入键层。
press_caps=keyFunc_toggleCapsLock
; CapsLock 层：字母用于移动、选中、编辑和翻译，数字用于窗口绑定。
