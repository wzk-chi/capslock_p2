; capslock_p2 (AHK v2) 配置示例
; -----------------------------------------------------------------------------
; 这是只读参考文件，不会被程序自动加载。完整默认值见 capslock_p2-default.ini；
; 用户只需把需要覆盖的键值写入 capslock_p2.ini。AHK2 版本支持 Global、TabHotString、Keys、LLM、LLMTranslate、
; TTranslate、TYoudao、TVolcengine、QAI、QSearch、QRun、QWeb、Qbar、CustomHotkey 十四个段。
; 翻译面板使用 WebView2（translate.html）：LLM（[LLM] 全局 API）优先，
; 未配置 LLM 时自动使用已配置的有道或火山翻译；
; Qbar 使用 WebView2 面板（qbar.html）。
;
; 设置格式：key=value；以分号开头的是注释。按键函数必须以 keyFunc_ 开头。
; 修改 capslock_p2.ini 后，程序会自动重新读取设置；只有有效变化才应用对应运行时更新。

[Global]
; 开机启动：1 开启，0 关闭；也可以直接在托盘菜单中勾选。关闭时会移除本程序创建的启动快捷方式。
autostart=0

; 调试日志：1 开启，写入 capslock_p2-debug.log；不记录剪贴板内容或 API Key。
debug=0

; CapsLock+LAlt+鼠标滚轮临时使用的鼠标速度，范围 1~20。
mouseSpeed=3

; 独立剪贴板：1 开启，0 关闭。
allowClipboard=1

; 启动动画：1 开启，0 关闭；也可以直接在托盘菜单中切换。默认显示现代简约启动卡片。
loadingAnimation=1

; 界面语言：0 自动，1 简体中文，2 英文。
language=0

; 以管理员身份运行：1 开启，0 关闭；修改后重启程序生效，启动时会弹出 UAC。
runAsAdmin=1

[LLM]
; LLM API 连接配置（OpenAI 兼容 chat completions）。
endpoint=https://api.openai.com/v1/chat/completions
apiKey=请在实际配置中填写
apiKeyHeader=Authorization
apiKeyPrefix=Bearer
model=deepseek-flash
; 思考模式：0（默认）= 同时发送 enable_thinking:false、reasoning_effort:none、
; reasoning.enabled:false、thinking.type:disabled、chat_template_kwargs.enable_thinking:false
; 关闭思考；1 = 不附加这些参数，使用模型默认行为。
thinking=0
temperature=0.2
timeout=30000
maxInputTokens=200000

[LLMTranslate]
; systemPrompt 是完整的 LLM 系统提示词模板；{{targetLanguage}} 会替换为目标语言，
; 待翻译正文仍放在 user 消息里。
systemPrompt=You are a precise translation engine. Translate the user's message into {{targetLanguage}}. Preserve meaning, tone, formatting, names and code. Keep the source text's line breaks and paragraph structure. Return only the translation, nothing else.

[TTranslate]
; 所有翻译引擎共用配置。fixed 只使用 targetLanguage；bidirectional 使用 languageA/languageB。
mode=fixed
languageA=zh-CN
languageB=en
; targetLanguage=system 跟随系统语言；也可填 zh-CN / zh-TW / en / ja / ko 等代码。
targetLanguage=system
; 翻译引擎：auto（默认，优先 LLM，未配置时按已配置的其他引擎回退）/
; llm（只用 LLM）/ youdao（只用有道）/ volcengine（只用火山）。
engine=auto

[TYoudao]
; 有道智云收费版翻译 API 凭据。翻译面板在未配置 [LLM] 时可使用它。
; 申请：https://ai.youdao.com/console/#/   入门指南：https://ai.youdao.com/doc.s#guide
; 在设置中心「有道翻译」页面中填写（保存到 capslock_p2.ini，不进安装包）。
appPaidID=
appPaidKey=

[TVolcengine]
; 火山引擎机器翻译 API（V4 签名，按量计费/有免费额度）。申请：https://console.volcengine.com/translate
; 在设置中心「火山翻译」页面中填写（保存到 capslock_p2.ini，不进安装包）。
accessKey=
secretKey=
region=cn-north-1

[QAI]
; QAI 只保存问答专用系统提示词，API 与模型参数统一使用 [LLM]。
systemPrompt=You are the assistant built into the capslock_p2 launcher. The user's message is either a question to answer or a text to explain; decide which one it is. If it is a question, answer it directly and completely. If it is a text (a word, sentence, paragraph, error message, log entry, code snippet or URL), explain what it means. Reply in the language of the user's message; if the message is not in Chinese or English, reply in {{uiLanguage}}. Be concise.

[TabHotString]
; CapsLock+Tab 会将光标左侧匹配到的键替换为对应值。尾部匹配的键来自三个段：
; 本段、[QRun]、[QWeb]（QRun/QWeb 按短键匹配，比如输 gh 展开成 GitHub 网址）。
; 同名时优先级：本段 > QRun > QWeb。
; 本段的值支持两个转义（C 风格）：「\n」替换成真实换行；「\\」替换成一个 \，
; 所以想输出字面的 \n 就写「\\n」。其余反斜杠组合原样保留（如 D:\docs 不用转义）。
; 例：值「——张三\n13800000000」展开成两行；值「a\\nb」展开成字面的 a\nb。
; QRun/QWeb 的值原样展开，不做转义。
clp=capslock-plus
addr=example@example.com
date=2026-09-20

[Keys]
; 短按 CapsLock：切换大小写；也可以改为 keyFunc_esc。
; 点按 CapsLock 时发送 Ctrl+Space；按住 CapsLock 仍使用键层。
press_caps=keyFunc_send(^{Space})

