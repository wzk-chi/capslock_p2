; -----------------------------------------------------------------------------
; Qbar（CapsLock+Q 启动器）
; -----------------------------------------------------------------------------
; 键名本身就是标签，写成「短键<显示名>」；短键用于输入触发，<显示名> 只是提示文字，
; 可以省略。值才是目标。
; 输入「短键 参数」回车：QSearch 会把 URL 编码后的参数替换进值里的 {q} 再打开。
;
; 按键补充：
;   Tab    把高亮行补进输入框；目录浏览时只替换最后一段路径。
;          列表隐藏时按 Tab 恢复显示。
;   \  /   同上补全，并且如果补出来的是文件夹，再补一个 \ 直接进入该目录。
;          没有可补全的行时按原字符输入。
;
; 文件搜索（Everything）：输入「e 关键词」等触发，别名 e / everything / find / f，
;   边输入边出结果；支持 Everything 原生查询语法（*.pdf、ext:pdf、size:>100mb、
;   dm:today…）。回车打开，Ctrl+回车在资源管理器中定位。本机 Everything 在跑就
;   直接用它；没在跑会自动启动 resources 里的内置实例（首次需一次管理员确认）。
;
; 内置命令：
;   cl set          打开设置文件（capslock_p2.ini 和本示例文件）
;   cl version      显示版本号（cl about 同）
;   web 网址        强制按网址打开，缺 http:// 时自动补
;   ai 问题 / q 问题 交给 [QAI] 配置的 AI 回答或解释（默认继承 [LLM]）；
;                   只要输入不是显式命令，列表首位固定是「AI 问答」行，
;                   回车即问；未配置 API 时自动弹出设置窗口。见 [QAI] 段。
;
; 搜索引擎别名：gg 同 g（谷歌），mdn 同 m（MDN）；在 [QSearch] 里配置了同名的
;   触发词时以配置为准。
;
; 行内添加条目（不用手动编辑本文件）：输入下列形式回车，弹确认框，确认即写入：
;   短键 ->类型 值
;   类型：run / path / file / folder / ftp  -> [QRun]
;         web / qweb                       -> [QWeb]
;         search / qsearch                 -> [QSearch]
;         str / string / hotstring         -> [TabHotString]
;   「->」后面留空则按值的形态自动判断：带 {q} 的网址 -> QSearch，能识别的
;   路径 -> QRun，网址 -> QWeb，其余 -> TabHotString。
;   例：vsc ->run C:\Program Files\Microsoft VS Code\Code.exe
;       gh ->web https://github.com
;       bd ->search https://www.baidu.com/s?wd={q}
;       clp ->str capslock-plus

[Qbar]
; Everything 文件搜索的可选配置，全部留空即用默认值。
; es.exe 路径，默认 resources\es.exe。
; esPath=
; 内置 Everything 主程序路径，默认自动在 resources 下找；仅当本机 Everything
; 没在运行时才会启动它（需要管理员权限建立索引，弹一次 UAC）。
; everythingPath=
; 内置实例名，默认 capslock_p2。
; esInstance=capslock_p2
; 最多返回的结果数，默认 50。
; esMaxResults=50

[QSearch]
; 搜索触发词，可选。本节留空时用一组内置默认：
;   s<搜索>       中文界面用 Bing，其他界面用 Google
;   bd<百度>      g<谷歌，别名 gg>      bing<必应>
;   wk<维基百科>  m<MDN，别名 mdn>
; 输入「触发词 关键词」回车，就用对应引擎搜索。这里写的条目只覆盖同名的那个内置
; 默认（按短键比对），其余照旧。比如只写 bd，g / bing / wk / m / s 都还在。
; 目前只有带触发词才算搜索——直接输入关键词回车不会搜。

[QRun]
; 程序 / 文件 / 文件夹。支持 *RunAs 前缀以管理员身份运行，也可以带参数，例如：
; admincmd<管理员 CMD>=*RunAs "C:\Windows\System32\cmd.exe"
; note<记事本>="C:\Windows\notepad.exe" "D:\note.txt"
vsc<VS Code>=C:\Program Files\Microsoft VS Code\Code.exe

[QWeb]
; 常用网址。值不带 http:// 时会自动补全。
gh<GitHub>=https://github.com

[QStyle]
; 面板外观，全部可选。不配置时使用内置主题（与翻译面板同一套配色/字体，
; 自动跟随系统明暗模式）。颜色支持 #RRGGBB，或沿用旧版的 0xBBGGRR 写法。
; borderBackgroundColor=#f5f7fb     ; 面板背景
; textBackgroundColor=#ffffff       ; 输入框背景
; textColor=#20242b                 ; 输入框文字
; listBackgroundColor=#ffffff       ; 列表背景
; listColor=#20242b                 ; 列表文字
; borderRadius=12                   ; 面板圆角（同时决定窗口被裁切的圆角）
; textFontSize=14                   ; 输入框字号
; listFontSize=13                   ; 列表字号
; listCount=10                      ; 列表最多显示行数
