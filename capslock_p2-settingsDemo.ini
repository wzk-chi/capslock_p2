; capslock_p2 (AHK v2) 配置示例
; -----------------------------------------------------------------------------
; 这是只读参考文件，不会被程序自动加载。需要自定义时，请复制需要的键值到
; capslock_p2.ini。AHK2 版本支持 Global、TabHotString、Keys、LLM、LLMTranslate、
; TTranslate、QAI、QSearch、QRun、QWeb、QStyle 十一个段。
; 翻译面板使用 WebView2（translate.html）：LLM（[LLM] 全局 API）优先，
; 未配置 LLM 时自动使用有道（[TTranslate]）；
; Qbar 使用 WebView2 面板（qbar.html）。
;
; 设置格式：key=value；以分号开头的是注释。按键函数必须以 keyFunc_ 开头。
; 修改 capslock_p2.ini 后，程序会自动重新读取设置。

[Global]
; 开机启动：1 开启，0 关闭；也可以直接在托盘菜单中勾选。关闭时会移除本程序创建的启动快捷方式。
autostart=0

; 调试日志：1 开启，写入 capslock_p2-debug.log；不记录剪贴板内容或 API Key。
debug=0

; CapsLock+LAlt+鼠标滚轮临时使用的鼠标速度，范围 1~20。
mouseSpeed=3

; 可选的 JavaScript 扩展文件，逗号分隔，文件放在根目录 loadScript 文件夹。
; CapsLock+Tab 会在内置计算器失败时尝试调用这些扩展中的函数。
loadScript=scriptDemo.js

; 独立剪贴板：1 开启，0 关闭。
allowClipboard=1

; 启动动画：1 开启，0 关闭；也可以直接在托盘菜单中切换。默认显示现代简约启动卡片。
loadingAnimation=1

; 界面语言：0 自动，1 简体中文，2 英文。
language=0

; 设为 1 时，优先返回 JavaScript 原始计算结果；通常保持 0。
javascriptOriginalReturn=0

[LLM]
; LLM API 连接配置（OpenAI 兼容 chat completions）。
endpoint=https://api.openai.com/v1/chat/completions
apiKey=请在实际配置中填写
apiKeyHeader=Authorization
apiKeyPrefix=Bearer
model=gpt-4o-mini
; 思考模式：0（默认）= 同时发送 enable_thinking:false、reasoning_effort:none、
; reasoning.enabled:false、thinking.type:disabled、chat_template_kwargs.enable_thinking:false
; 关闭思考；1 = 不附加这些参数，使用模型默认行为。
thinking=0
; 非流式连接测试使用结构化输出：1（默认）= 请求 response_format json_schema，模型固定返回
; {"translation":"..."}，解析更可靠；翻译正文采用流式纯文本返回；网关不支持时设为 0。
structured=1
temperature=0.2
maxTokens=2048
timeout=30000

[LLMTranslate]
; 翻译行为配置。翻译设置界面保存时也会写入这里。
enabled=1
targetLanguage=中文
; 翻译引擎：auto（默认，优先 LLM，未配置 LLM 时用有道）/ llm（只用 LLM）/ youdao（只用有道）。
engine=auto
; systemPrompt 只写角色设定；「翻译成 xx 语言 / 保留语气格式 / JSON 输出」等
; 任务说明由程序自动追加到 system 消息，待翻译正文放在 user 消息里。
systemPrompt=You are a precise translation engine.

[TTranslate]
; 有道智云收费版翻译 API。翻译面板在未配置 [LLM] 时自动使用它；[LLM] 已配置则优先 LLM。
; 申请：https://ai.youdao.com/console/#/   入门指南：https://ai.youdao.com/doc.s#guide
; 在设置页面「有道翻译」标签中填写（保存到 capslock_p2.ini，不进安装包）。
appPaidID=
appPaidKey=
; 有道译文的目标语言，独立于 [LLMTranslate] 的 targetLanguage。留空 = auto
; （源语言非中文时译为简体中文，中文时译为英文）。可填 简体中文/繁体中文/English/
; 日语/韩语/法语/德语/西班牙语/俄语 等名称，或语言代码（zh-CHS/en/ja/ko…）。
targetLanguage=

[TVolcengine]
; 火山引擎机器翻译 API（V4 签名，按量计费/有免费额度）。翻译面板在未配置 [LLM]
; 时自动使用它；[LLM] 已配置则优先 LLM。申请：https://console.volcengine.com/translate
; 在设置页面「火山翻译」标签中填写（保存到 capslock_p2.ini，不进安装包）。
accessKey=
secretKey=
; 火山译文的目标语言，独立于 [LLMTranslate] 的 targetLanguage。TranslateText
; 必填目标语言（源语言服务端自动识别），留空 = zh。可填 简体中文/繁体中文/
; English/日语/韩语/法语/德语 等名称，或语言代码（zh/zh-Hant/en/ja/ko…）。
; region=cn-north-1        服务区域，一般无需修改
targetLanguage=

[QAI]
; QAI 是问答功能的可选覆盖段：未填写的连接字段自动使用 [LLM] 全局配置。
; [LLM] 已配置时即可直接使用 AI 问答；QAI 只需填写需要单独覆盖的项目。
; endpoint=、apiKey= 留空表示使用 [LLM] 的对应值。
; model=gpt-4o-mini        只有问答需要不同模型时才填写
; temperature=0.7         只有问答需要不同采样参数时才填写
; maxTokens=2048
; timeout=60000
; thinking=0              0=显式关闭思考；1=模型默认行为
; contextChars=200000    单次请求的历史字符预算，默认上限 200k；超出预算最旧轮次丢弃
;                        单条超长消息只送尾部（约预算一半）。
; systemPrompt=…          问答专用系统提示词；不填则使用程序默认提示词。

[TabHotString]
; CapsLock+Tab 会将光标左侧匹配到的键替换为对应值。尾部匹配的键来自三个段：
; 本段、[QRun]、[QWeb]（QRun/QWeb 按短键匹配，比如输 gh 展开成 GitHub 网址）。
; 同名时优先级：本段 > QRun > QWeb。
; 本段的值支持两个转义（C 风格）：「\n」替换成真实换行；「\\」替换成一个 \，
; 所以想输出字面的 \n 就写「\\n」。其余反斜杠组合原样保留（如 D:\docs 不用转义）。
; 例：值「——张三\n13800000000」展开成两行；值「a\\nb」展开成字面的 a\nb。
; QRun/QWeb 的值原样展开，不做转义。
clp=capslock-plus
addr=example@example.com
date=2026-09-20

